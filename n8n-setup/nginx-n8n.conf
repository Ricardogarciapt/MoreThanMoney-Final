# Nginx config para n8n.morethanmoney.pt
# Coloca este ficheiro em: /etc/nginx/sites-available/n8n.morethanmoney.pt
# Depois: ln -s /etc/nginx/sites-available/n8n.morethanmoney.pt /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d n8n.morethanmoney.pt

server {
    listen 80;
    server_name n8n.morethanmoney.pt;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name n8n.morethanmoney.pt;

    # SSL (preenchido pelo certbot)
    ssl_certificate /etc/letsencrypt/live/n8n.morethanmoney.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.morethanmoney.pt/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/n8n.access.log;
    error_log  /var/log/nginx/n8n.error.log;

    location / {
        proxy_pass http://localhost:5678;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (n8n usa ws para editor em tempo real)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts para workflows longos
        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;

        # Upload máximo (para importar workflows grandes)
        client_max_body_size 50M;
    }
}
