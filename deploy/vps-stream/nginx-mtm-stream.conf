# Nginx na VPS — stream.morethanmoney.pt
# SRS HTTP (HLS) em 127.0.0.1:8080, app RTMP "live".
#
# O master .m3u8 público fica em /hls/<chave>.m3u8 (proxy → SRS /live/<chave>.m3u8).
# O SRS devolve no M3U8 caminhos /live/... para variantes e .ts — também têm de ir para o SRS.
#
# Instalação:
#   Ver deploy/vps-stream/README.md (HTTPS + Certbot).
#   Snippet só para colar no server 443: nginx-mtm-stream.locations-snippet.conf
#   Exemplo completo 80+443: nginx-mtm-stream-https.conf.example
#
#   sudo cp deploy/vps-stream/nginx-mtm-stream.conf /etc/nginx/sites-available/mtm-stream
#   sudo ln -sf /etc/nginx/sites-available/mtm-stream /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name stream.morethanmoney.pt;

    # Playlist principal (URL usada pelo site MTM)

    # Diálogos do Telegram (MTProto, só leitura) — serviço `mtm-dialogos`, /opt/mtm-dialogos/dialogos.py.
    # É ELE o dono da porta 8787 nesta VPS. O segredo viaja no Authorization e é o serviço
    # que o confere — o nginx só encaminha e trata do TLS. A barra final no proxy_pass é
    # precisa: tira o prefixo /telegram-dialogos/ do caminho.
    location /telegram-dialogos/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # WS de preços do MTM Funded (funded-motor, ws-precos.ts) — wss://stream.morethanmoney.pt/precos
    # PORTA 8788, não 8787: a 8787 está ocupada pelo `mtm-dialogos` (bloco acima). Foi essa a
    # razão da mudança — não voltar a pôr 8787 só porque era o que estava no código. Tem de
    # bater certo com o WS_PRECOS_PORTA do /etc/mtm-funded-motor.env e com o default do motor.
    location /precos {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /hls/ {
        proxy_pass http://127.0.0.1:8080/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Variantes HLS e segmentos (.ts) — referenciados dentro do M3U8 do SRS
    location /live/ {
        proxy_pass http://127.0.0.1:8080/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        return 200 'MTM stream OK\n';
        add_header Content-Type text/plain;
    }
}
