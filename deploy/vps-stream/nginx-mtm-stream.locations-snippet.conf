# Colar DENTRO do bloco: server { listen 443 ssl; server_name stream....; ... }
# Imediatamente ANTES de qualquer "location /" genérico (senão o pedido cai no placeholder).
#
# Playlist pública (site MTM): https://HOST/hls/<chave>.m3u8
location /hls/ {
    proxy_pass http://127.0.0.1:8080/live/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Access-Control-Allow-Origin * always;
}

