<script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Why do I need a hardware wallet?","acceptedAnswer":{"@type":"Answer","text":"The smartest choice when securing your crypto is using a hardware wallet that stores private keys offline, making them independent of third parties and resistant to online threats. Software wallets store private keys on systems that are connected to the internet, making them susceptible to all kinds of attacks. Ledger Nano X™ is a pocket-size hardware wallet that seamlessly connects with your smartphone or computer. Through the Ledger Wallet™ (formerly Ledger Live™) app and our partners, you can securely buy, exchange and grow your crypto."}},{"@type":"Question","name":"What happens if I lose/break my Ledger Nano X™ or Ledger Nano S Plus™ ?","acceptedAnswer":{"@type":"Answer","text":"Misplaced your Ledger? It got stolen? Accidentally soaked it in water or dropped it from a considerable height. Don’t worry, losing your Ledger doesn’t mean losing your crypto.  Your assets are stored on the blockchain, which you can access using your Ledger. You can access, manage, and retrieve your assets as long as your secret recovery phrase is safe and accessible only to you. Simply get another Ledger and restore accounts using your recovery phrase. And boom, you’re back in the game."}},{"@type":"Question","name":"What coins does a Ledger Nano X™ and Ledger Nano S Plus™ support?","acceptedAnswer":{"@type":"Answer","text":"With a Ledger Nano X™ and a Ledger Nano S Plus™ you can manage 15,000+ coins and tokens, including Bitcoin, Ethereum and XRP, and install up to 100 apps. Here you can find the full list of supported coins and tokens → Supported assets"}},{"@type":"Question","name":"What’s the difference between Ledger Nano S Plus™ and Ledger Nano X™?","acceptedAnswer":{"@type":"Answer","text":"Besides many similarities, there are also notable differences between the two wallets. Ledger Nano X™ comes with Bluetooth functionality and is compatible with Ledger Wallet™ (formerly Ledger Live™) for iOS. Here is a detailed comparison of our hardware wallets → Compare different Ledgers"}},{"@type":"Question","name":"How to transfer your crypto from exchanges to Ledger Nano X™ or Ledger Nano S Plus™?","acceptedAnswer":{"@type":"Answer","text":"With the Ledger Wallet™ app (formerly Ledger Live™), it&apos;s easy to transfer crypto from an exchange to your Ledger Nano X™ or Ledger Nano S Plus™. You will need to generate a deposit address and then paste it into your exchange account to withdraw your funds. When you withdraw crypto to your Ledger, you control the assets, not a third party. For more information on transferring your crypto from an exchange, check out this article → How to Transfer Your Crypto From Exchanges"}},{"@type":"Question","name":"Why are Ledger devices now called “signers” instead of a &quot;hardware wallet”?","acceptedAnswer":{"@type":"Answer","text":"Security has evolved, and so have we. Ledger signer isn’t just a new name, it’s a new standard. A signer isn’t just a hardware wallet; it’s a device that proves you are truly you when accessing apps, signing transactions, and securing your digital life. \n\nLedger devices don’t store digital value. They sign transactions. They prove intent. They verify identity. \n\nThey’re the secure bridge between who you are and what you do online. They don’t just hold private keys. Signers empower you to trust yourself. We now call Ledger devices signers because that’s what they truly are."}}]}</script>
