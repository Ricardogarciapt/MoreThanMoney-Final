<script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Do I lose my crypto if I lose my Ledger Flex™?","acceptedAnswer":{"@type":"Answer","text":"Don&apos;t worry, you&apos;ll be able to access, manage, and retrieve your crypto as long as your Secret Recovery Phrase is safe and accessible only to you. Simply get another Ledger Flex™ or any other Ledger and recover access to your accounts using the Secret Recovery phrase."}},{"@type":"Question","name":"Why should I use Ledger Flex™ rather than an exchange or a software wallet to store my digital assets?","acceptedAnswer":{"@type":"Answer","text":"Software wallets store private keys on systems or devices that are connected to the internet, making them susceptible to all kinds of attacks. Holding your crypto on an exchange means entrusting the private keys to a third party and not having any control over your funds. Ledger Flex™ stores your private keys offline on a Secure Element chip, and provides full isolation between the keys and your computer/smartphone to give you complete control over your assets."}},{"@type":"Question","name":"Can someone steal my funds if they have access to my Ledger Flex™?","acceptedAnswer":{"@type":"Answer","text":"Even if someone steals your Ledger Flex™, they won&apos;t be able to access it without knowing your PIN. Entering the wrong PIN three times in a row will automatically reset your Ledger Flex™ to its factory settings."}},{"@type":"Question","name":"How can I migrate my funds from my wallet to Ledger Flex™?","acceptedAnswer":{"@type":"Answer","text":"After setting up your Ledger Flex, you&apos;ll need to follow the steps outlined in this article to transfer your crypto from an exchange. If you want to send funds from a software wallet to your Ledger Flex™ follow this tutorial."}},{"@type":"Question","name":"Why are Ledger devices now called “signers” instead of a &quot;hardware wallet”?","acceptedAnswer":{"@type":"Answer","text":"Security has evolved, and so have we. Ledger signer isn’t just a new name, it’s a new standard. A signer isn’t just a hardware wallet; it’s a device that proves you are truly you when accessing apps, signing transactions, and securing your digital life. Ledger devices don’t store digital value. They sign transactions. They prove intent. They verify identity. They’re the secure bridge between who you are and what you do online. They don’t just hold private keys. Signers empower you to trust yourself. We now call Ledger devices signers because that’s what they truly are."}},{"@type":"Question","name":"What is the &quot;Secure Screen&quot; and how does it protect me?","acceptedAnswer":{"@type":"Answer","text":"The Secure Screen is controlled directly by the Secure Element of your signer, not your computer or phone, so what you see on the device screen is what you are actually approving, no hacker can alter it. It’s a critical safeguard, giving you complete transparency before you confirm a transaction, ensuring that what you see is what you sign."}}]}</script>
