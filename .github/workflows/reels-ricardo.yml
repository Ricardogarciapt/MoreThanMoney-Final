name: Reels do @ricardogarciapt (gémeo IA)

# Todos os dias: o site escolhe o próximo guião do funil de marca pessoal e gera a voz clonada do
# Ricardo; esta máquina desenha o reel (fotos dele animadas + legendas + capa) e devolve-o à fila
# do Instagram. Nada sai sem site_settings.reels_ricardo.ligado = true. Ver services/reels-ricardo.

on:
  schedule:
    - cron: '40 6 * * *'   # 06:40 UTC
  workflow_dispatch:
    inputs:
      n:
        description: 'Guião a desenhar (vazio = o próximo)'
        required: false
        default: ''
      rascunho:
        description: 'Deixar em rascunho (não agenda)'
        type: boolean
        default: false

concurrency:
  group: reels-ricardo
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/reels-ricardo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy pillow

      - name: Desenhar e entregar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          python3 services/reels-ricardo/robo.py
          ${{ inputs.n && format('--n={0}', inputs.n) || '' }}
          ${{ inputs.rascunho && '--rascunho' || '' }}
