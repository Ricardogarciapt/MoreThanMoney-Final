name: External Cron Runner (MoreThanMoney)

# Backup opcional — o plano Vercel Pro corre estes crons via vercel.json.
# CRON_SECRET deve ser idêntico em Vercel + GitHub Secrets.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 * * * *'
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

env:
  SITE_URL: https://www.morethanmoney.pt

jobs:
  high-frequency:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar CRON_SECRET configurado
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET não está definido em GitHub → Settings → Secrets → Actions"
            exit 1
          fi

      - name: Verificar alertas de preço (check-alerts)
        run: |
          HTTP=$(curl -s -o /tmp/check-alerts.json -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/notifications/check-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "check-alerts → HTTP $HTTP"
          cat /tmp/check-alerts.json || true
          test "$HTTP" = "200" || exit 1

      - name: Verificar fecho de TP/SL (nightly-tp-sl)
        continue-on-error: true
        run: |
          HTTP=$(curl -s -o /tmp/nightly-tp-sl.json -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/cron/nightly-tp-sl" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120)
          echo "nightly-tp-sl → HTTP $HTTP"
          cat /tmp/nightly-tp-sl.json || true

  hourly-email:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar CRON_SECRET configurado
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET não configurado"
            exit 1
          fi

      - name: Sequências de email marketing (sequences/process)
        run: |
          HTTP=$(curl -s -o /tmp/email-seq.json -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/email-marketing/sequences/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "email-sequences → HTTP $HTTP"
          cat /tmp/email-seq.json || true
          test "$HTTP" = "200" || test "$HTTP" = "503" || exit 1

  daily-maintenance:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar CRON_SECRET configurado
        run: test -n "${{ secrets.CRON_SECRET }}" || (echo "::error::CRON_SECRET missing" && exit 1)

      - name: Subscrições de membros (member-subscriptions)
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/cron/member-subscriptions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "member-subscriptions → HTTP $HTTP"
          test "$HTTP" = "200" || exit 1

      - name: Verificar trials expirados (check-trials)
        continue-on-error: true
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/cron/check-trials" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "check-trials → HTTP $HTTP"

  daily-expiry:
    if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar CRON_SECRET configurado
        run: test -n "${{ secrets.CRON_SECRET }}" || (echo "::error::CRON_SECRET missing" && exit 1)

      - name: Expiração de subscrições (subscription-expiry)
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/cron/subscription-expiry" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "subscription-expiry → HTTP $HTTP"
          test "$HTTP" = "200" || exit 1

  daily-dca:
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar CRON_SECRET configurado
        run: test -n "${{ secrets.CRON_SECRET }}" || (echo "::error::CRON_SECRET missing" && exit 1)

      - name: Verificação diária de DCA (daily-dca-check)
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/cron/daily-dca-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "daily-dca-check → HTTP $HTTP"
          test "$HTTP" = "200" || exit 1

      - name: Publicação diária de DCA (daily-dca-post)
        continue-on-error: true
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ env.SITE_URL }}/api/cron/daily-dca-post" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120)
          echo "daily-dca-post → HTTP $HTTP"
