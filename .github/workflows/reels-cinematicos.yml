name: Reels cinemáticos (molde AnuncioReel)

# Desde 20/11/2026 TODOS os reels do gémeo (as duas marcas: @morethanmoney.pt e @ricardogarciapt)
# saem no molde cinemático aprovado pelo Ricardo: gémeo HeyGen por baixo, gancho cinético, legendas
# palavra a palavra, PiP com b-roll/ecrãs das Demos e Soluções, chips, transições discretas, música + SFX, cartão final, -14 LUFS.
# Esta máquina pega nos projectos 'a_render' do molde cinemático, monta-os e devolve-os ao site, que os
# põe na fila do Instagram como RASCUNHO e pede aprovação ao Ricardo (Telegram + briefing 9h30).
# Nada é publicado daqui. Ver video/cinematico/robo-cinematico.mjs e video/motor/LEIA-ME.md.

on:
  schedule:
    - cron: '20 5,8,11,14,17,20 * * *'   # 6×/dia; sem trabalho sai em segundos
  workflow_dispatch:
    inputs:
      max:
        description: 'Máximo de reels nesta ronda'
        required: false
        default: '6'

concurrency:
  group: reels-cinematicos
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            video/cinematico
            video/motor
            public/ricardogarcia

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Há trabalho?
        id: ver
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          node video/cinematico/robo-cinematico.mjs --pedir --espreitar
          c=$?
          if [ $c -eq 3 ]; then echo "trabalho=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "trabalho=1" >> "$GITHUB_OUTPUT"; exit $c

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.trabalho == '1'
        with:
          python-version: '3.11'

      - name: Dependências (ffmpeg, numpy, faster-whisper, Remotion)
        if: steps.ver.outputs.trabalho == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy faster-whisper pillow
          cd video/cinematico && npm ci --no-audit --no-fund --loglevel=error
          # ecrãs das Demos/Soluções fotografados do site ao montar (capturarDemos)
          npm i --no-save --no-audit --no-fund --loglevel=error playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: Modelo de voz (cache)
        if: steps.ver.outputs.trabalho == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Stock (cache)
        if: steps.ver.outputs.trabalho == '1'
        uses: actions/cache@v4
        with:
          path: video/cinematico/public/stock
          key: stock-cinematico-v1

      - name: Stock Mixkit
        if: steps.ver.outputs.trabalho == '1'
        run: bash video/cinematico/stock-mixkit.sh

      - name: Montar
        if: steps.ver.outputs.trabalho == '1'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ASR_LOCAL_MODELO: small
          REMOTION_CONC: '2'
        run: node video/cinematico/robo-cinematico.mjs --max=${{ inputs.max || '6' }}
