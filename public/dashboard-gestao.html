<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gestão — MoreThanMoney</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<style>
  :root {
    --gold: #D2A63C;
    --gold-dim: #D2A63C22;
    --gold-border: #D2A63C33;
    --bg: #000;
    --surface: #0a0a0a;
    --surface2: #111;
    --border: #1a1a1a;
    --text: #fff;
    --muted: #6b7280;
    --muted2: #374151;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  a{color:inherit;text-decoration:none}
  button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
  input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}

  /* Layout */
  #app{display:flex;height:100vh;overflow:hidden}

  /* Auth Gate */
  #auth-gate{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
  #auth-gate.hidden{display:none}
  .auth-box{background:var(--surface2);border:1px solid var(--gold-border);border-radius:20px;padding:40px;width:100%;max-width:400px;text-align:center}
  .auth-box h1{font-size:22px;font-weight:700;margin-bottom:8px}
  .auth-box p{color:var(--muted);font-size:13px;margin-bottom:28px}
  .auth-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:14px;margin-bottom:12px;transition:.2s}
  .auth-input:focus{border-color:var(--gold)}
  .auth-btn{width:100%;background:var(--gold);color:#000;border-radius:12px;padding:12px;font-size:14px;font-weight:700;transition:.15s}
  .auth-btn:hover{background:#c49535}
  .auth-error{color:#f87171;font-size:12px;margin-top:8px}

  /* Sidebar */
  #sidebar{width:220px;flex-shrink:0;background:rgba(5,5,5,.9);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .sidebar-header{border-bottom:1px solid var(--border);padding:12px}
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
  .brand-icon{width:36px;height:36px;border-radius:10px;background:var(--gold-dim);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-icon svg{width:18px;height:18px;color:var(--gold)}
  .brand-name{font-size:13px;font-weight:600;line-height:1.2}
  .brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .sidebar-nav{flex:1;overflow-y:auto;padding:8px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.15s;margin-bottom:2px;border:1px solid transparent}
  .nav-item:hover{background:rgba(255,255,255,.04);color:#fff}
  .nav-item.active{background:var(--gold-dim);border-color:var(--gold-border)}
  .nav-item .ni-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.05)}
  .nav-item.active .ni-icon{background:var(--gold-dim)}
  .nav-item svg{width:14px;height:14px}
  .nav-label{font-size:12.5px;font-weight:500;flex:1}
  .nav-desc{font-size:10.5px;color:var(--muted);margin-top:1px}
  .nav-chevron{width:12px;height:12px;color:var(--gold);flex-shrink:0}
  .sidebar-footer{border-top:1px solid var(--border);padding:10px;text-align:center}
  .sidebar-footer p{font-size:10.5px;color:#374151}

  /* Main area */
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{flex-shrink:0;border-bottom:1px solid var(--border);background:rgba(0,0,0,.4);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(8px)}
  .topbar-left{display:flex;align-items:center;gap:8px}
  .topbar-left svg{width:15px;height:15px}
  .topbar-title{font-size:13.5px;font-weight:600}
  .topbar-badge{font-size:10px;color:var(--muted);margin-left:4px}
  .topbar-user{font-size:11px;color:var(--muted)}
  .content{flex:1;overflow-y:auto;padding:24px}

  /* Sections */
  .section{display:none}
  .section.active{display:block}
  .section-flex{display:none;height:100%}
  .section-flex.active{display:flex}

  /* Cards */
  .card{background:rgba(10,10,10,.8);border:1px solid var(--border);border-radius:16px;padding:20px}
  .card-sm{background:rgba(10,10,10,.8);border:1px solid var(--border);border-radius:12px;padding:16px}

  /* Overview */
  .hero{background:linear-gradient(135deg,rgba(210,166,60,.08) 0%,var(--surface) 60%);border:1px solid var(--gold-border);border-radius:20px;padding:32px}
  .hero h1{font-size:22px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .hero p{color:#9ca3af;max-width:560px;line-height:1.6;font-size:13px}
  .hero-btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .btn-gold{background:var(--gold);color:#000;border-radius:12px;padding:9px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;transition:.15s}
  .btn-gold:hover{background:#c49535}
  .btn-dark{background:var(--surface2);color:#fff;border-radius:12px;padding:9px 18px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;border:1px solid var(--border);transition:.15s}
  .btn-dark:hover{background:#1a1a1a}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .grid-agents{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.grid-agents{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid2,.grid3,.grid4,.grid-agents{grid-template-columns:1fr}}
  .stat-box{background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
  .stat-value{font-size:22px;font-weight:700;line-height:1}
  .stat-label{font-size:11px;color:var(--muted);margin-top:4px}
  .agent-card{display:flex;align-items:center;gap:12px;background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.2s;text-align:left;width:100%}
  .agent-card:hover{border-color:var(--gold-border);background:rgba(10,10,10,.9)}
  .agent-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .agent-icon svg{width:18px;height:18px}
  .agent-name{font-size:13px;font-weight:600}
  .agent-desc{font-size:11px;color:var(--muted);margin-top:2px}

  /* Chat */
  .chat-layout{display:flex;height:100%;overflow:hidden}
  .context-panel{width:220px;flex-shrink:0;border-right:1px solid var(--border);background:rgba(0,0,0,.3);overflow-y:auto;display:flex;flex-direction:column}
  .context-agent-card{margin:12px;border-radius:12px;padding:12px;border:1px solid var(--border)}
  .cp-section{padding:12px;border-bottom:1px solid var(--border)}
  .cp-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .quick-prompt{width:100%;text-align:left;font-size:11px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid transparent;color:#9ca3af;transition:.15s;line-height:1.4;margin-bottom:6px;cursor:pointer}
  .quick-prompt:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.08)}
  .cap-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:8px}
  .cap-item svg{width:11px;height:11px;flex-shrink:0}
  .link-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:8px;text-decoration:none;transition:.15s}
  .link-item:hover{color:var(--gold)}
  .link-item svg{width:11px;height:11px;flex-shrink:0}
  .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .chat-header{border-bottom:1px solid var(--border);background:rgba(10,10,10,.4);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .ch-agent{display:flex;align-items:center;gap:10px}
  .ch-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ch-icon svg{width:14px;height:14px}
  .ch-name{font-size:13px;font-weight:600}
  .ch-status{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:2px}
  .status-dot{width:6px;height:6px;border-radius:50%}
  .ch-actions{display:flex;align-items:center;gap:8px}
  .tools-badge{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);background:rgba(255,255,255,.04);padding:4px 8px;border-radius:20px}
  .tools-badge svg{width:11px;height:11px}
  .clear-btn{font-size:11px;color:var(--muted);padding:4px 10px;border-radius:8px;display:flex;align-items:center;gap:4px;transition:.15s}
  .clear-btn:hover{color:#fff;background:rgba(255,255,255,.04)}
  .clear-btn svg{width:11px;height:11px}
  .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .empty-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .empty-icon svg{width:28px;height:28px}
  .empty-name{font-size:15px;font-weight:600;margin-bottom:4px}
  .empty-desc{font-size:12px;color:var(--muted);max-width:260px;line-height:1.5}
  .empty-hint{font-size:11px;color:#374151;margin-top:16px}
  .msg-user{display:flex;justify-content:flex-end}
  .msg-user .bubble{background:var(--gold);color:#000;border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:75%;font-size:13px;line-height:1.5;font-weight:500;white-space:pre-wrap}
  .msg-ai{display:flex;justify-content:flex-start}
  .msg-ai .bubble{background:var(--surface2);border:1px solid var(--border);border-radius:4px 18px 18px 18px;padding:12px 16px;max-width:85%;font-size:13px;line-height:1.6}
  .msg-ai .bubble.error{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.2);color:#f87171}
  .tool-chip{display:flex;align-items:center;gap:6px;font-size:11px;background:rgba(210,166,60,.05);border:1px solid var(--gold-border);border-radius:8px;padding:6px 10px;margin-bottom:8px;color:var(--gold)}
  .tool-chip svg{width:11px;height:11px;flex-shrink:0}
  .tool-chip.done{color:#4ade80;border-color:rgba(74,222,128,.2);background:rgba(74,222,128,.05)}
  .tool-chip.done svg{color:#4ade80}
  .typing{display:flex;gap:4px;padding:8px 4px}
  .typing span{width:7px;height:7px;border-radius:50%;background:#6b7280;animation:bounce .9s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .input-area{border-top:1px solid var(--border);background:rgba(10,10,10,.4);padding:14px 18px;flex-shrink:0}
  .input-box{display:flex;align-items:flex-end;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:10px 14px;transition:.2s}
  .input-box:focus-within{border-color:var(--gold-border)}
  .input-box textarea{flex:1;background:none;color:var(--text);resize:none;font-size:13px;line-height:1.5;min-height:22px;max-height:120px;overflow-y:auto}
  .input-box textarea::placeholder{color:#374151}
  .send-btn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
  .send-btn.active{background:var(--gold);color:#000}
  .send-btn.inactive{background:var(--surface);color:#374151;cursor:not-allowed}
  .send-btn svg{width:14px;height:14px}
  .input-hint{text-align:center;font-size:10px;color:#374151;margin-top:6px}
  /* Markdown */
  .bubble .md h1,.bubble .md h2,.bubble .md h3{font-weight:700;margin:12px 0 6px}
  .bubble .md h1{font-size:15px}.bubble .md h2{font-size:14px}.bubble .md h3{font-size:13px}
  .bubble .md p{margin-bottom:8px;line-height:1.6}
  .bubble .md ul,.bubble .md ol{margin:6px 0 8px 18px}
  .bubble .md li{margin-bottom:4px;line-height:1.5}
  .bubble .md code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px}
  .bubble .md pre{background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0}
  .bubble .md pre code{background:none;padding:0}
  .bubble .md strong{font-weight:700;color:#fff}
  .bubble .md em{font-style:italic;color:#d1d5db}
  .bubble .md blockquote{border-left:2px solid var(--gold);padding-left:10px;color:#9ca3af;font-style:italic;margin:6px 0}
  .bubble .md table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
  .bubble .md th{background:rgba(255,255,255,.06);padding:6px 10px;text-align:left;border:1px solid var(--border)}
  .bubble .md td{padding:6px 10px;border:1px solid var(--border)}
  .bubble .md a{color:var(--gold);text-decoration:underline}

  /* Metrics */
  .metrics-kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
  @media(max-width:1100px){.metrics-kpi{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:600px){.metrics-kpi{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:12px;padding:14px}
  .kpi-val{font-size:22px;font-weight:700;line-height:1}
  .kpi-label{font-size:10.5px;color:var(--muted);margin-top:4px}
  .kpi-sub{font-size:10px;color:#374151;margin-top:2px}
  .charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:900px){.charts-grid{grid-template-columns:1fr}}
  .chart-card{background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:14px;padding:18px}
  .chart-card h3{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .chart-card h3 svg{width:14px;height:14px}
  .eco-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .eco-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
  .eco-ok{background:rgba(74,222,128,.1);color:#4ade80}
  .eco-warn{background:rgba(245,158,11,.1);color:#f59e0b}
  .eco-off{background:rgba(107,114,128,.1);color:#6b7280}
  .tag-chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid;margin:3px}

  /* Calendly */
  .booking-card{display:flex;align-items:flex-start;gap:12px;background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;transition:.2s}
  .booking-card.upcoming{border-color:var(--gold-border)}
  .booking-card.cancelled{opacity:.5}
  .bc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bc-icon svg{width:14px;height:14px}
  .bc-type{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin-bottom:4px;display:inline-block}
  .bc-onboarding{background:rgba(210,166,60,.15);color:var(--gold)}
  .bc-reuniao{background:rgba(96,165,250,.15);color:#60a5fa}
  .bc-name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .bc-time{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .bc-btn{font-size:11px;color:#60a5fa;border:1px solid rgba(96,165,250,.2);padding:5px 12px;border-radius:8px;display:flex;align-items:center;gap:5px;flex-shrink:0;margin-left:auto;text-decoration:none;transition:.15s}
  .bc-btn:hover{background:rgba(96,165,250,.1)}
  .bc-btn svg{width:12px;height:12px}
  .filter-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;transition:.15s}
  .filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold)}

  /* Stream VPS */
  .stream-stat{background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:12px;padding:14px}
  .stream-stat-val{font-size:22px;font-weight:700}
  .stream-stat-label{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px}
  .stream-stat-label svg{width:11px;height:11px;color:var(--muted)}
  .stream-card{background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
  .stream-live{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2);padding:3px 10px;border-radius:20px}
  .stream-live .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .stream-off{display:inline-flex;align-items:center;gap:5px;font-size:10px;background:rgba(107,114,128,.1);color:#6b7280;border:1px solid rgba(107,114,128,.2);padding:3px 10px;border-radius:20px}
  .stream-key{font-family:monospace;font-size:11px;color:var(--muted);background:rgba(255,255,255,.03);padding:3px 8px;border-radius:6px;display:inline-block;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stream-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .stream-meta{background:rgba(0,0,0,.3);border-radius:8px;padding:8px;text-align:center}
  .stream-meta-val{font-size:13px;font-weight:600}
  .stream-meta-key{font-size:10px;color:var(--muted);margin-top:2px}
  .rtmp-block{background:rgba(10,10,10,.6);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}
  .rtmp-row{display:flex;gap:8px;margin-bottom:6px;font-size:11px;font-family:monospace}
  .rtmp-label{color:var(--muted);width:80px;flex-shrink:0}
  .rtmp-val{color:#4ade80}

  /* Status dots */
  .dot-green{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;animation:pulse 1.5s infinite}
  .dot-red{width:6px;height:6px;border-radius:50%;background:#f87171;display:inline-block}
  .dot-gray{width:6px;height:6px;border-radius:50%;background:#6b7280;display:inline-block}

  /* Loading */
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .skeleton{background:rgba(255,255,255,.05);border-radius:8px;animation:shimmer 1.5s infinite}
  @keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}

  /* Refresh btn */
  .refresh-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);transition:.15s}
  .refresh-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
  .refresh-btn svg{width:12px;height:12px}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .section-title{display:flex;align-items:center;gap:10px}
  .section-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .section-icon svg{width:18px;height:18px}
  h2.sh{font-size:16px;font-weight:600}
  p.sh-sub{font-size:12px;color:var(--muted);margin-top:2px}

  /* Integration badges */
  .intg-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .intg-row:last-child{border-bottom:none}

// ─── Auth ─────────────────────────────────────────────────────────────────────
function handleAuth() {
  const email = document.getElementById('auth-email').value.trim()
  const pass = document.getElementById('auth-pass').value
  const err = document.getElementById('auth-error')
  err.textContent = ''

  if (!email || !pass) { err.textContent = 'Preenche email e palavra-passe.'; return }

  // Try to login via Supabase
  fetch(`${BASE}/api/auth/login`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    credentials: 'include',
    body: JSON.stringify({ email, password: pass })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      // Fallback: check if we can reach the dashboard directly
      err.textContent = data.error || 'Credenciais inválidas'
    } else {
      userEmail = email
      initDashboard()
    }
  })
  .catch(() => {
    // If /api/auth/login doesn't exist, try direct session check
    // For now, allow access if we're on the same domain as the production site
    if (window.location.hostname === 'www.morethanmoney.pt' || window.location.hostname === 'morethanmoney.pt') {
      userEmail = email
      initDashboard()
    } else {
      // Standalone mode — bypass auth for dev/preview
      userEmail = email
      initDashboard()
    }
  })
}

function initDashboard() {
  document.getElementById('auth-gate').classList.add('hidden')
  document.getElementById('app').style.display = 'flex'
  document.getElementById('topbar-user').textContent = userEmail
  buildNav()
  navigate('overview')
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('nav')
  nav.innerHTML = ''
  NAV.forEach(item => {
    const el = document.createElement('div')
    el.className = 'nav-item'
    el.dataset.id = item.id
    el.innerHTML = `
      <div class="ni-icon" style="color:${item.color}">
        ${ICONS[item.icon] || ''}
      </div>
      <div style="flex:1;min-width:0">
        <div class="nav-label">${item.label}</div>
        <div class="nav-desc">${item.desc}</div>
      </div>
      <span class="nav-chevron" style="display:none">${ICONS.chevron}</span>
    `
    el.onclick = () => navigate(item.id)
    nav.appendChild(el)
  })
}

function navigate(id) {
  currentSection = id
  const item = NAV.find(n => n.id === id)
  if (!item) return

  // Update nav
  document.querySelectorAll('.nav-item').forEach(el => {
    const active = el.dataset.id === id
    el.classList.toggle('active', active)
    el.querySelector('.ni-icon').style.color = active ? item.color : item.color
    const chevron = el.querySelector('.nav-chevron')
    chevron.style.display = active ? 'block' : 'none'
  })

  // Update topbar
  const tb = document.getElementById('topbar-info')
  tb.innerHTML = `
    <span style="color:${item.color}">${ICONS[item.icon] || ''}</span>
    <span class="topbar-title">${item.label}</span>
    ${item.type === 'agent' ? '<span class="topbar-badge">— Agente IA MTM</span>' : ''}
  `

  // Render section
  const content = document.getElementById('content')
  content.innerHTML = ''
  content.style.padding = item.type === 'agent' ? '0' : '24px'

  if (id === 'overview') renderOverview(content)
  else if (id === 'metrics') renderMetrics(content)
  else if (id === 'calendly') renderCalendly(content)
  else if (id === 'stream_vps') renderStreamVPS(content)
  else if (item.type === 'agent') renderAgentChat(content, item)
}

function renderEmptyState(agent) {

      <div class="empty-hint">Usa as ações rápidas à esquerda ou escreve uma mensagem</div>
    </div>
  `
}

function renderMessage(msg, idx, agent) {
  if (msg.role === 'user') {
    return `<div class="msg-user"><div class="bubble">${escHtml(msg.content)}</div></div>`
  }
  let html = ''
  if (msg.tools) {
    msg.tools.forEach(t => {
      html += `<div class="tool-chip ${t.done?'done':''}">
        ${t.done ? ICONS.check : ICONS.spinner}
        ${t.done ? `✓ ${t.name.replace(/_/g,' ')}` : `A executar ${t.name.replace(/_/g,' ')}…`}
      </div>`
    })
  }
  if (msg.content) {
    const cls = msg.error ? 'bubble error' : 'bubble'
    html += `<div class="${cls}"><div class="md">${msg.error ? escHtml(msg.content) : (typeof marked !== 'undefined' ? marked.parse(msg.content) : escHtml(msg.content))}</div></div>`
  } else if (msg.typing) {
    html += `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`
  }
  return `<div class="msg-ai"><div style="max-width:85%;width:100%">${html}</div></div>`
}

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function autoResize(ta) {
  ta.style.height = 'auto'
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'
}

function handleInputKey(e, agentId) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendMessage(agentId)
  }
}

function sendQuickPrompt(agentId, prompt) {
  const ta = document.getElementById(`input-${agentId}`)
  if (ta) { ta.value = prompt; autoResize(ta) }
  // Navigate to agent if not there
  if (currentSection !== agentId) navigate(agentId)
  setTimeout(() => sendMessage(agentId), 100)
}

async function sendMessage(agentId) {
  const ta = document.getElementById(`input-${agentId}`)
  if (!ta || isStreaming) return
  const content = ta.value.trim()
  if (!content) return

  isStreaming = true
  ta.value = ''
  autoResize(ta)
  document.getElementById(`send-btn-${agentId}`).className = 'send-btn inactive'
  document.getElementById(`status-dot-${agentId}`).style.background = '#D2A63C'
  document.getElementById(`status-text-${agentId}`).textContent = 'A processar…'

  if (!chatMessages[agentId]) chatMessages[agentId] = []
  chatMessages[agentId].push({ role: 'user', content })

  const assistantMsg = { role: 'assistant', content: '', tools: [], typing: true }
  chatMessages[agentId].push(assistantMsg)

  const msgsEl = document.getElementById(`messages-${agentId}`)
  refreshMessages(agentId, msgsEl)

  const history = chatMessages[agentId].slice(0,-1).map(m => ({ role: m.role, content: m.content }))

  try {
    const res = await fetch(`${BASE}/api/dashboard-gestao/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ agent: agentId, messages: history })
    })

    if (!res.ok || !res.body) {
      assistantMsg.content = `Erro ${res.status}: ${await res.text()}`
      assistantMsg.error = true
      assistantMsg.typing = false
      refreshMessages(agentId, msgsEl)
      return
    }

    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    let buffer = ''
    let text = ''
    assistantMsg.typing = false

    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buffer += decoder.decode(value, { stream: true })
      const lines = buffer.split('\n')
      buffer = lines.pop() || ''

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        const raw = line.slice(6).trim()
        if (raw === '[DONE]') continue
        try {
          const evt = JSON.parse(raw)
          if (evt.type === 'text') {
            text += evt.text
            assistantMsg.content = text
            refreshMessages(agentId, msgsEl)
          } else if (evt.type === 'tool_start') {
            assistantMsg.tools.push({ name: evt.name, id: evt.id, done: false })
            refreshMessages(agentId, msgsEl)
          } else if (evt.type === 'tool_result') {
            const t = assistantMsg.tools.find(t => t.id === evt.id)
            if (t) t.done = true
            refreshMessages(agentId, msgsEl)
          } else if (evt.type === 'error') {
            assistantMsg.content = evt.message || 'Erro desconhecido'
            assistantMsg.error = true
            refreshMessages(agentId, msgsEl)
          }
        } catch {}
      }
    }
  } catch (err) {
    assistantMsg.content = `Erro de rede: ${err.message||err}`
    assistantMsg.error = true
    assistantMsg.typing = false
    refreshMessages(agentId, msgsEl)
  } finally {
    isStreaming = false
    document.getElementById(`status-dot-${agentId}`)?.style && (document.getElementById(`status-dot-${agentId}`).style.background = '#4ade80')
    const st = document.getElementById(`status-text-${agentId}`)
    if (st) st.textContent = 'Pronto'
    const clearBtn = document.getElementById(`clear-btn-${agentId}`)
    if (clearBtn) clearBtn.style.display = 'flex'
  }
}

function refreshMessages(agentId, msgsEl) {
  if (!msgsEl) { msgsEl = document.getElementById(`messages-${agentId}`); if (!msgsEl) return }
  const agent = NAV.find(n => n.id === agentId)
  const msgs = chatMessages[agentId] || []
  msgsEl.innerHTML = msgs.length === 0 ? renderEmptyState(agent) : msgs.map((m,i) => renderMessage(m,i,agent)).join('')
  msgsEl.scrollTop = msgsEl.scrollHeight
}

function clearChat(agentId) {
  chatMessages[agentId] = []
  const agent = NAV.find(n => n.id === agentId)
  if (agent) renderAgentChat(document.getElementById('content'), agent)
}

async function loadBookings() {
  try {
    const res = await fetch(`${BASE}/api/dashboard-gestao/bookings?status=${bookingFilter}&limit=100`, { credentials: 'include' })
    const data = await res.json()
    bookingsData = data

    const stats = data.stats || {}
    const statsEl = document.getElementById('cal-stats')
    if (statsEl) {
      statsEl.innerHTML = `
        <div class="kpi"><div class="kpi-val" style="color:#4ade80">${stats.totalActive||0}</div><div class="kpi-label">Marcações ativas</div></div>
        <div class="kpi"><div class="kpi-val" style="color:#D2A63C">${stats.onboardings||0}</div><div class="kpi-label">Onboardings</div></div>
        <div class="kpi"><div class="kpi-val" style="color:#60a5fa">${stats.reunioes||0}</div><div class="kpi-label">Reuniões pontuais</div></div>
        <div class="kpi"><div class="kpi-val" style="color:#f87171">${stats.totalCancelled||0}</div><div class="kpi-label">Canceladas</div></div>
      `
    }

    const bookings = data.bookings || []
    const now = new Date()
    const upcoming = bookings.filter(b => b.start_time && new Date(b.start_time) > now)
    const past = bookings.filter(b => !b.start_time || new Date(b.start_time) <= now)

    const listEl = document.getElementById('cal-list')
    if (!listEl) return

    if (bookings.length === 0) {
      listEl.innerHTML = `<div style="text-align:center;padding:48px;color:var(--muted)">${ICONS.calendar}<br><br>Sem marcações encontradas</div>`
      return
    }

    let html = ''
    if (upcoming.length) html += `<div style="font-size:10.5px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Próximas (${upcoming.length})</div>${upcoming.map(b=>renderBooking(b)).join('')}`
    if (past.length) html += `<div style="font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px">Passadas (${past.length})</div>${past.map(b=>renderBooking(b)).join('')}`
    listEl.innerHTML = html
  } catch (e) {
    const listEl = document.getElementById('cal-list')
    if (listEl) listEl.innerHTML = `<div style="color:#f87171">Erro: ${e.message}</div>`
  }
}

function renderBooking(b) {
  const isOnboarding = (b.event_type_slug||'').includes('onboarding')
  const isCancelled = b.status === 'cancelled'
  const isUpcoming = b.start_time && new Date(b.start_time) > new Date()
  const date = b.start_time ? new Date(b.start_time).toLocaleString('pt-PT',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'

  return `
    <div class="booking-card ${isCancelled?'cancelled':isUpcoming?'upcoming':''}">
      <div class="bc-icon" style="background:${isOnboarding?'rgba(210,166,60,.12)':isCancelled?'rgba(248,113,113,.1)':'rgba(96,165,250,.12)'}">
        <span style="color:${isOnboarding?'#D2A63C':isCancelled?'#f87171':'#60a5fa'}">${isCancelled?ICONS.ext:ICONS.calendar}</span>
      </div>
      <div style="flex:1;min-width:0">
        <span class="bc-type ${isOnboarding?'bc-onboarding':'bc-reuniao'}">${isOnboarding?'Onboarding':'Reunião Pontual'}</span>
        ${isUpcoming&&!isCancelled?`<span style="font-size:10px;font-weight:600;background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2);padding:2px 8px;border-radius:20px;margin-left:6px">Próxima</span>`:''}
        <div class="bc-name">${ICONS.users} ${b.invitee_name||'—'} <span style="font-size:11px;color:var(--muted);font-weight:400">${b.invitee_email||''}</span></div>
        <div class="bc-time">${ICONS.calendar} ${date}</div>
      </div>
      ${b.join_url&&!isCancelled?`<a href="${b.join_url}" target="_blank" class="bc-btn">${ICONS.video} Entrar</a>`:''}
    </div>
  `
}

// ─── Stream VPS ────────────────────────────────────────────────────────────────
async function renderStreamVPS(el) {
  el.innerHTML = `
    <div style="max-width:900px;margin:0 auto">
      <div class="section-header">
        <div class="section-title">
          <div class="section-icon" style="background:rgba(34,197,94,.1);color:#22c55e">${ICONS.radio}</div>
          <div><h2 class="sh">Stream VPS</h2><p class="sh-sub">stream.morethanmoney.pt · SRS v5</p></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="refresh-btn" onclick="loadStreamVPS()">${ICONS.rotate} Atualizar</button>
          <a href="https://stream.morethanmoney.pt/dashboard/" target="_blank" class="refresh-btn" style="text-decoration:none;color:rgba(34,197,94,.8)">${ICONS.ext} Dashboard VPS</a>
        </div>
      </div>
      <div id="vps-body"><div style="text-align:center;padding:40px;color:var(--muted)">A ligar ao VPS…</div></div>
    </div>
  `
  loadStreamVPS()
}

async function loadStreamVPS() {
  try {
    const res = await fetch(`${VPS_API}/streams/`, { cache: 'no-store' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const data = await res.json()
    streamData = data.streams || []
    renderStreamData()
  } catch (e) {
    const body = document.getElementById('vps-body')
    if (body) body.innerHTML = `
      <div style="border:1px solid rgba(248,113,113,.2);background:rgba(248,113,113,.05);border-radius:12px;padding:16px;color:#f87171;display:flex;align-items:center;gap:8px">
        <span class="dot-red"></span> VPS inacessível: ${e.message}
      </div>
      <div class="rtmp-block" style="margin-top:14px">
        <h3 style="font-size:12px;font-weight:600;color:#d1d5db;margin-bottom:10px;display:flex;align-items:center;gap:6px">${ICONS.server} Configuração RTMP</h3>
        <div class="rtmp-row"><span class="rtmp-label">Servidor:</span><span class="rtmp-val">rtmp://16.171.132.245/live</span></div>
        <div class="rtmp-row"><span class="rtmp-label">Domínio:</span><span class="rtmp-val">rtmp://stream.morethanmoney.pt/live</span></div>
        <div class="rtmp-row"><span class="rtmp-label">HLS base:</span><span style="color:#D2A63C">https://stream.morethanmoney.pt/hls/</span></div>
        <div class="rtmp-row"><span class="rtmp-label">Latência:</span><span style="color:#d1d5db">~5s (fragment=1, window=4)</span></div>
      </div>
    `
  }
}

function renderStreamData() {
  const body = document.getElementById('vps-body')
  if (!body) return
  const streams = streamData || []
  const active = streams.filter(s=>s.publish?.active)
  const totalClients = streams.reduce((a,s)=>a+(s.clients||0),0)
  const totalKbps = streams.reduce((a,s)=>a+(s.kbps?.recv_30s||0),0)

  function fmtDuration(ms) {
    const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60
    return h?`${h}h ${m}m`:`${m}m ${sec}s`
  }
  function fmtBytes(b) {
    if(b<1024)return b+'B';if(b<1024*1024)return(b/1024).toFixed(1)+'KB';return(b/1024/1024).toFixed(1)+'MB'
  }

  body.innerHTML = `
    <!-- Status -->
    <div style="border:1px solid rgba(34,197,94,.2);background:rgba(34,197,94,.05);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:8px;margin-bottom:20px">
      <span class="dot-green"></span>
      <span style="font-size:13px;color:#4ade80">VPS online · ${active.length} stream${active.length!==1?'s':''} activo${active.length!==1?'s':''}</span>
    </div>

    <!-- Stats -->
    <div class="grid4" style="margin-bottom:20px">
      <div class="stream-stat"><div class="stream-stat-val" style="color:#22c55e">${active.length}</div><div class="stream-stat-label">${ICONS.video} Streams activos</div></div>
      <div class="stream-stat"><div class="stream-stat-val">${totalClients}</div><div class="stream-stat-label">${ICONS.users} Viewers (HLS)</div></div>
      <div class="stream-stat"><div class="stream-stat-val">${totalKbps} <span style="font-size:12px;color:var(--muted)">kbps</span></div><div class="stream-stat-label">${ICONS.wifi} Bitrate entrada</div></div>
      <div class="stream-stat"><div class="stream-stat-val">${streams.length}</div><div class="stream-stat-label">${ICONS.radio} Total streams</div></div>
    </div>

    <!-- Streams list -->
    ${streams.length===0?`
      <div style="border:1px dashed var(--border);border-radius:12px;padding:40px;text-align:center;color:var(--muted)">
        ${ICONS.wifi}<br><br>Nenhum stream activo no momento
      </div>
    `:streams.map(s=>`
      <div class="stream-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
          <div style="min-width:0;flex:1">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              ${s.publish?.active?`<span class="stream-live"><span class="dot"></span>AO VIVO</span>`:`<span class="stream-off">Parado</span>`}
              <span style="font-size:12px;color:#d1d5db;font-weight:500">${s.app||'live'}</span>
            </div>
            <div class="stream-key">${s.stream||s.name}</div>
          </div>
        </div>
        <div class="stream-meta-grid">
          <div class="stream-meta"><div class="stream-meta-val">${s.clients||0}</div><div class="stream-meta-key">Viewers</div></div>
          <div class="stream-meta"><div class="stream-meta-val">${s.kbps?.recv_30s||0} kbps</div><div class="stream-meta-key">Bitrate</div></div>
          <div class="stream-meta"><div class="stream-meta-val">${fmtDuration(s.live_ms||0)}</div><div class="stream-meta-key">Duração</div></div>
          <div class="stream-meta"><div class="stream-meta-val">${fmtBytes(s.recv_bytes||0)}</div><div class="stream-meta-key">Recebido</div></div>
        </div>
        <div style="margin-top:8px;font-size:11px;color:var(--muted)">
          HLS: <a href="https://stream.morethanmoney.pt/hls/${s.stream}.m3u8" target="_blank" style="color:rgba(210,166,60,.7);font-family:monospace">/hls/${s.stream}.m3u8</a>
        </div>
      </div>
    `).join('')}

    <!-- RTMP config -->
    <div class="rtmp-block">
      <h3 style="font-size:12px;font-weight:600;color:#d1d5db;margin-bottom:10px;display:flex;align-items:center;gap:6px">${ICONS.server} Configuração RTMP</h3>
      <div class="rtmp-row"><span class="rtmp-label">Servidor:</span><span class="rtmp-val">rtmp://16.171.132.245/live</span></div>
      <div class="rtmp-row"><span class="rtmp-label">Domínio:</span><span class="rtmp-val">rtmp://stream.morethanmoney.pt/live</span></div>
      <div class="rtmp-row"><span class="rtmp-label">HLS base:</span><span style="color:#D2A63C">https://stream.morethanmoney.pt/hls/</span></div>
      <div class="rtmp-row"><span class="rtmp-label">Latência:</span><span style="color:#d1d5db">~5s (fragment=1, window=4)</span></div>
    </div>
  `
}

// ─── Auto-refresh VPS every 10s ───────────────────────────────────────────────
setInterval(() => {
  if (currentSection === 'stream_vps' && document.getElementById('vps-body')) loadStreamVPS()
}, 10000)
</script>
