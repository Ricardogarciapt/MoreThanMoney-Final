<head>

<style>
@font-face { font-family: "Anton"; src: url("/ricardogarcia/fontes/Anton.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Oswald"; src: url("/ricardogarcia/fontes/Oswald.ttf") format("truetype"); font-weight: 200 700; font-display: swap; }
@font-face { font-family: "Kalam"; src: url("/ricardogarcia/fontes/Kalam.ttf") format("truetype"); font-display: swap; }
:root {
  --ciano: #0098B2; --ciano-claro: #1EAAE6; --azul: #1256BE; --ouro: #D2A63C; --ouro-claro: #E9C46A;
  --fundo: #07080c; --cartao: #0f121a; --cartao2: #141824; --linha: #1d2230; --texto: #f2f2f2; --suave: #9aa3b2; --bom: #3ecf8e; --mau: #f87171;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fundo); color: var(--texto); font-family: "Oswald", system-ui, sans-serif; font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ciano-claro); }
h1, h2, h3 { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .5px; margin: 0; }
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
/* barra lateral */
.lado { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--linha); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; background: #090b11; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; margin: 0 6px 22px; }
.marca img { width: 38px; height: 38px; border-radius: 10px; }
.marca b { font-family: "Anton", sans-serif; text-transform: uppercase; font-style: italic; font-size: 19px; font-weight: 400; line-height: 1; }
.marca b span { color: var(--ciano-claro); }
.marca small { display: block; color: var(--suave); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 12px; background: transparent; color: #c4cad6; cursor: pointer; text-align: left; font-size: 16px; letter-spacing: .3px; min-height: 44px; }
.nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: none; }
.nav button:hover { background: #121621; color: #fff; }
.nav button.on { background: linear-gradient(90deg, rgba(30,170,230,.16), rgba(30,170,230,0)); color: #fff; box-shadow: inset 3px 0 0 var(--ciano-claro); }
.nav button .n { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--ouro); color: #111; font-size: 13px; display: grid; place-items: center; font-weight: 600; }
.lado .rodape { margin-top: auto; font-size: 13px; color: var(--suave); padding: 0 8px; }
.lado .rodape a { color: var(--suave); }
/* conteúdo */
main { padding: 28px clamp(16px, 3vw, 40px) 120px; max-width: 1180px; width: 100%; }
.cab { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.cab h1 { font-size: clamp(30px, 4vw, 44px); font-style: italic; line-height: 1; }
.cab p { margin: 6px 0 0; color: var(--suave); }
.kalam { font-family: "Kalam", cursive; color: var(--ouro); }
.grelha { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c6 { grid-column: span 6; } .c4 { grid-column: span 4; }
.cx { background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 18px; min-width: 0; }
.cx h2 { font-size: 17px; letter-spacing: 1.5px; color: var(--ouro-claro); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.cx h2 small { margin-left: auto; font-family: "Oswald", sans-serif; color: var(--suave); font-size: 13px; letter-spacing: .5px; text-transform: none; }
.vazio { color: var(--suave); margin: 4px 0; font-size: 15px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { background: var(--cartao2); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; }
.kpi b { display: block; font-family: "Anton", sans-serif; font-size: 34px; line-height: 1; font-weight: 400; }
.kpi span { color: var(--suave); font-size: 14px; }
.kpi.ouro b { color: var(--ouro-claro); } .kpi.ciano b { color: var(--ciano-claro); }
/* controlos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; min-height: 44px; border-radius: 12px; border: 1px solid #2a3142; background: #151a26; color: #fff; cursor: pointer; text-decoration: none; font-size: 15px; letter-spacing: .3px; }
.btn:hover { border-color: var(--ciano-claro); }
.btn.pri { background: linear-gradient(135deg, var(--ciano-claro), var(--azul)); border-color: transparent; }
.btn.ouro { background: linear-gradient(135deg, var(--ouro-claro), var(--ouro)); color: #111; border-color: transparent; }
.btn.peq { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.fant { background: transparent; border-color: transparent; color: var(--suave); }
.btn.fant:hover { color: #fff; }
.btn.perigo:hover { border-color: var(--mau); color: var(--mau); }
input[type=text], input[type=url], input[type=number], input[type=email], input:not([type]), select, textarea { width: 100%; background: #0b0e15; border: 1px solid #262d3d; border-radius: 10px; padding: 10px 12px; min-height: 44px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--ciano-claro); box-shadow: 0 0 0 3px rgba(30,170,230,.15); }
textarea { resize: vertical; min-height: 90px; }
label.campo { display: block; font-size: 13px; color: var(--suave); letter-spacing: .5px; margin: 0 0 12px; }
label.campo > span { display: block; margin-bottom: 5px; }
.linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid #161b27; cursor: pointer; }
.check:last-child { border-bottom: 0; }
.check input { width: 20px; height: 20px; accent-color: var(--ciano-claro); flex: none; }
.check span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.check.feito span { color: var(--suave); text-decoration: line-through; }
.check .imp { width: 8px; height: 8px; border-radius: 50%; background: var(--ouro); display: inline-block; margin-right: 6px; vertical-align: middle; }
.x { border: 0; background: transparent; color: #5d6577; cursor: pointer; font-size: 20px; width: 32px; height: 32px; border-radius: 8px; flex: none; }
.x:hover { color: var(--mau); background: #1a1f2b; }
.addrow { display: flex; gap: 8px; margin-top: 10px; }
.addrow input { flex: 1; }
.addrow select { width: auto; }
.pilula { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; border: 1px solid #2a3142; color: var(--suave); white-space: nowrap; }
.pilula.novo { border-color: rgba(233,196,106,.6); color: var(--ouro-claro); }
.pilula.on { border-color: rgba(62,207,142,.5); color: var(--bom); }
.pilula.off { border-color: #3a2a2a; color: #b98b8b; }
.barra { height: 8px; border-radius: 99px; background: #1a1f2b; overflow: hidden; }
.barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--ciano-claro), var(--ouro)); border-radius: 99px; transition: width .4s ease; }
/* hoje */
.saudacao { font-family: "Kalam", cursive; color: var(--ouro); font-size: 22px; }
.prioridades input { margin-bottom: 8px; }
.humor { display: flex; gap: 8px; }
.humor button { flex: 1; min-height: 46px; border-radius: 12px; border: 1px solid #262d3d; background: #0b0e15; font-size: 22px; cursor: pointer; }
.humor button.on { border-color: var(--ouro); background: rgba(210,166,60,.12); }
.hab { display: grid; grid-template-columns: 1fr repeat(7, 34px) 32px; gap: 6px; align-items: center; }
.hab .nome { overflow-wrap: anywhere; font-size: 15px; }
.hab .nome small { display: block; color: var(--ouro-claro); font-size: 12px; }
.hab .d { width: 34px; height: 34px; border-radius: 9px; border: 1px solid #262d3d; background: #0b0e15; cursor: pointer; }
.hab .d.on { background: linear-gradient(135deg, var(--ciano-claro), var(--azul)); border-color: transparent; }
.hab .d.hoje { outline: 2px solid var(--ouro); outline-offset: 1px; }
.hab .d:disabled { opacity: .3; cursor: default; }
.hab .dl { text-align: center; font-size: 11px; color: var(--suave); text-transform: uppercase; }
.evento { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #161b27; }
.evento:last-child { border-bottom: 0; }
.evento .h { font-family: "Anton", sans-serif; font-size: 20px; color: var(--ciano-claro); line-height: 1; }
.evento .h small { display: block; font-family: "Oswald", sans-serif; color: var(--suave); font-size: 12px; margin-top: 3px; }
.evento b { display: block; font-weight: 500; }
.evento span { color: var(--suave); font-size: 14px; }
.dia-sep { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--ouro-claro); margin: 14px 0 2px; }
/* página */
.sec { border: 1px solid var(--linha); border-radius: 16px; background: var(--cartao); margin-bottom: 14px; overflow: hidden; }
.sec.off { opacity: .6; }
.sec-cab { display: flex; align-items: center; gap: 10px; padding: 14px 16px; flex-wrap: wrap; }
.sec-cab h3 { font-size: 20px; font-style: italic; flex: 1; min-width: 160px; }
.sec-cab .tipo { font-size: 12px; }
.sec-corpo { padding: 0 16px 16px; display: none; }
.sec.aberta .sec-corpo { display: block; }
.item { display: grid; grid-template-columns: 1fr 1fr 1.2fr 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid #161b27; }
.item .acc { display: flex; gap: 2px; }
.toggle { position: relative; width: 46px; height: 26px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: #2a3142; cursor: pointer; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle input:checked + i { background: var(--ciano-claro); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { box-shadow: 0 0 0 3px rgba(30,170,230,.35); }
.barra-guardar { position: sticky; bottom: 16px; z-index: 5; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: rgba(15,18,26,.95); border: 1px solid rgba(233,196,106,.45); backdrop-filter: blur(8px); margin-top: 16px; }
.barra-guardar[hidden] { display: none; }
/* produtos */
.prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.prod { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.prod .img { aspect-ratio: 16/9; background: linear-gradient(135deg, #10203a, #1a1408); display: grid; place-items: center; font-family: "Anton", sans-serif; font-size: 22px; color: rgba(255,255,255,.25); text-transform: uppercase; }
.prod .img img { width: 100%; height: 100%; object-fit: cover; }
.prod .corpo { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.prod h3 { font-size: 19px; font-style: italic; }
.prod .preco { font-family: "Anton", sans-serif; color: var(--ouro-claro); font-size: 22px; }
.prod .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.prod .acc { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
dialog { background: var(--cartao); color: var(--texto); border: 1px solid var(--linha); border-radius: 18px; padding: 0; width: min(620px, 94vw); max-height: 90vh; }
dialog::backdrop { background: rgba(0,0,0,.65); }
dialog form { padding: 20px; overflow: auto; max-height: 90vh; }
dialog h2 { font-size: 24px; font-style: italic; margin-bottom: 14px; }
.opcoes { display: flex; gap: 8px; margin-bottom: 14px; }
.opcoes label { flex: 1; display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid #262d3d; border-radius: 12px; cursor: pointer; font-size: 15px; }
.opcoes label:has(input:checked) { border-color: var(--ciano-claro); background: rgba(30,170,230,.08); }
/* contactos */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filtros button { border-radius: 999px; }
.filtros button.on { border-color: var(--ouro); color: var(--ouro-claro); }
.contacto { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 0; border-bottom: 1px solid #161b27; }
.contacto b { font-size: 17px; font-weight: 500; }
.contacto .sub { color: var(--suave); font-size: 14px; }
.contacto p { margin: 6px 0 0; color: #d4d8e0; font-size: 15px; overflow-wrap: anywhere; }
.contacto .acc { display: flex; gap: 6px; flex-wrap: wrap; align-items: start; justify-content: end; }
.contacto select { width: auto; min-height: 36px; padding: 6px 10px; }
/* aviso */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0; background: #11161f; border: 1px solid var(--ouro); color: #fff; padding: 10px 16px; border-radius: 12px; transition: all .25s; z-index: 50; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.bloqueado { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
.bloqueado .cx { max-width: 440px; }
.bloqueado h1 { font-size: 34px; font-style: italic; margin: 10px 0; }
.doca { display: none; }
@media (max-width: 1000px) { .c8, .c6, .c4 { grid-column: span 12; } .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .lado { display: none; }
  main { padding: 18px 14px 110px; }
  .doca { display: flex; position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20; gap: 2px; padding: 6px; border-radius: 18px; background: rgba(12,14,20,.94); border: 1px solid var(--linha); backdrop-filter: blur(10px); }
  .doca button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; color: #8d96a8; font-size: 11px; padding: 6px 2px; border-radius: 12px; min-height: 52px; justify-content: center; position: relative; cursor: pointer; }
  .doca button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .doca button.on { color: #fff; background: rgba(30,170,230,.14); }
  .doca .n { position: absolute; top: 3px; right: 18%; min-width: 16px; height: 16px; border-radius: 99px; background: var(--ouro); color: #111; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
  .barra-guardar { bottom: 84px; }
  .item { grid-template-columns: 1fr; }
  .item .acc { justify-content: end; }
  .linha2 { grid-template-columns: 1fr; }
  .hab { grid-template-columns: 1fr repeat(7, 28px) 28px; gap: 4px; }
  .hab .d { width: 28px; height: 28px; }
  .contacto { grid-template-columns: 1fr; }
  .contacto .acc { justify-content: start; }
  .toast { bottom: 90px; }
}
.p30-hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.p30-hoje { background: linear-gradient(135deg, rgba(210,166,60,.13), rgba(30,170,230,.06)); border-color: rgba(210,166,60,.45); }
.p30-hoje .tema { font-size: 22px; font-style: italic; margin: 6px 0; line-height: 1.2; }
.p30-hoje .gancho { font-family: "Kalam", cursive; color: var(--ouro-claro); font-size: 19px; margin: 0 0 12px; }
.p30-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.p30-anel { display: flex; align-items: center; gap: 16px; }
.p30-anel svg { width: 92px; height: 92px; flex: none; }

.p30-dia { position: relative; min-width: 0; overflow: hidden; aspect-ratio: 1; border-radius: 10px; border: 1px solid #232a38; background: #0b0e15; color: #c4cad6; cursor: pointer; font: inherit; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 44px; }
.p30-dia b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 16px; line-height: 1; }
.p30-dia small { font-size: 10px; letter-spacing: .6px; text-transform: uppercase; color: var(--suave); }
.p30-dia.hoje { outline: 2px solid var(--ouro); outline-offset: 1px; }
.p30-dia.sel { border-color: var(--ciano-claro); background: #101827; }
.p30-dia.passado { opacity: .75; }
.p30-dia i { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #2a3142; }
.p30-dia i.guiao { background: var(--ciano-claro); } .p30-dia i.gravado { background: #a78bfa; } .p30-dia i.video { background: var(--ouro); } .p30-dia i.pub { background: var(--bom); }
.p30-leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--suave); margin-top: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>
<div id="raiz"><div class="bloqueado"><div class="cx"><p class="vazio">A abrir o teu painel…</p></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgProduto">
  <form method="dialog" id="fProduto">
    <h2 id="dlgTit">Novo produto</h2>
    <input type="hidden" name="id">
    <div class="opcoes" role="radiogroup" aria-label="Origem do produto">
      <label><input type="radio" name="origem" value="mkt" checked> Do marketplace MTM</label>
      <label><input type="radio" name="origem" value="proprio"> Só meu, com link próprio</label>
    </div>
    <label class="campo" data-o="mkt"><span>Produto do marketplace</span><select name="marketplace_slug"></select></label>
    <label class="campo" data-o="proprio"><span>Link de compra</span><input type="url" name="url" placeholder="https://"></label>
    <label class="campo"><span>Nome</span><input name="titulo" maxlength="140" required></label>
    <label class="campo"><span>Frase curta</span><input name="subtitulo" maxlength="200"></label>
    <label class="campo"><span>Descrição</span><textarea name="descricao" maxlength="3000"></textarea></label>
    <div class="linha2">
      <label class="campo"><span>Preço (€)</span><input type="number" name="preco" min="0" step="0.01" inputmode="decimal"></label>
      <label class="campo"><span>Preço antes, riscado (€, opcional)</span><input type="number" name="preco_antes" min="0" step="0.01" inputmode="decimal"></label>
      <label class="campo"><span>Depois do preço (ex.: /mês, opcional)</span><input name="preco_sufixo" maxlength="20"></label>
      <label class="campo"><span>Imagem (link)</span><input type="url" name="imagem_url" placeholder="https://"></label>
    </div>
    <label class="check" style="border:0"><input type="checkbox" name="so_landing" checked><span>Só aparece na minha página (não no marketplace geral)</span></label>
    <label class="check" style="border:0"><input type="checkbox" name="activo" checked><span>Visível agora</span></label>
    <div style="display:flex;gap:8px;justify-content:end;margin-top:14px">
      <button class="btn fant" value="cancelar" formnovalidate>Cancelar</button>
      <button class="btn pri" value="guardar" id="btnGuardarProd">Guardar produto</button>
    </div>
  </form>
</dialog>

<script>
(function () {

      if ((id = e.target.getAttribute('data-ob'))) { guardarDado('objetivos', dado('objetivos', []).map(function (o) { return o.id === id ? Object.assign({}, o, { p: +e.target.value }) : o; })); vMetasMes(el); }
    }, { once: true });
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; var id;
      if ((id = b.getAttribute('data-mtx'))) { e.preventDefault(); guardarDado(km, dado(km, []).filter(function (m) { return m.id !== id; })); vMetasMes(el); }
      if ((id = b.getAttribute('data-obx'))) { e.preventDefault(); guardarDado('objetivos', dado('objetivos', []).filter(function (o) { return o.id !== id; })); vMetasMes(el); }
    }, { once: true });
    $('#fMeta').addEventListener('submit', function (e) { e.preventDefault(); var i = e.target.querySelector('input'); guardarDado(km, dado(km, []).concat([{ id: uid(), t: i.value.trim(), ok: false }])); vMetasMes(el); });
    $('#fObj').addEventListener('submit', function (e) { e.preventDefault(); var i = e.target.querySelector('input'); guardarDado('objetivos', dado('objetivos', []).concat([{ id: uid(), t: i.value.trim(), p: 0 }])); vMetasMes(el); });
  }

  // ───────────── Metas: plano de 30 dias (ligado ao /estudio, à app e ao público virtual) ─────────────
  var P30 = null, p30Sel = null, p30Ocupado = false;
  var API_P30 = '/api/ricardogarcia/painel/plano';
  var FMT = { reel: 'Reel', carrossel: 'Carrossel', story: 'Story', post: 'Post' };
  var OBJN = { atracao: 'Atração', autoridade: 'Autoridade', conversao: 'Conversão' };
  var EST30 = { guiao: 'Guião criado', gravado: 'Gravado', video: 'Vídeo pronto', perdido: 'Guião apagado' };
  var FOCOS = ['Reels com o clone', 'Carrosséis', 'Levar à app', 'Trading consciente', 'Mindset', 'IA e digital', 'Treino', 'Vendas e conversas'];
  function p30(corpo) {
    return fetch(API_P30, { method: corpo ? 'POST' : 'GET', credentials: 'same-origin', headers: corpo ? { 'Content-Type': 'application/json' } : {}, body: corpo ? JSON.stringify(corpo) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.ok === false) throw new Error(j.erro || j.message || 'Erro'); return j; }); });
  }
  function diaAtual() { if (!P30 || !P30.plano) return 0; var n = Math.floor((Date.parse(P30.hoje) - Date.parse(P30.plano.inicio)) / 864e5) + 1; return n; }
  function estadoDia(d) { if (d.publicado) return 'pub'; return d.peca_id ? (P30.estudio[d.peca_id] || 'guiao') : ''; }
  function linkEstudio(d) {
    var notas = 'Gancho: ' + d.gancho + (P30.plano.objetivo ? '\nObjetivo do mês: ' + P30.plano.objetivo : '') + '\nDia ' + d.d + ' do plano de 30 dias.';
    return '/estudio?tab=criar&formato=' + d.formato + '&objectivo=' + d.objectivo + '&plano=' + d.d + '&tema=' + encodeURIComponent(d.tema) + '&notas=' + encodeURIComponent(notas);
  }
  function semanaDe(d) { return Math.min(3, Math.floor((d - 1) / 7)); }

  function vMetas(el) {
    el.innerHTML = '<div class="cab"><div><h1>Metas</h1><p>O plano de 30 dias, ligado ao Estúdio e à app. Depois, o mês e os objetivos grandes.</p></div></div><div id="p30"><p class="vazio">A carregar o plano…</p></div><div id="metasMes"></div>';
    vMetasMes($('#metasMes'));
    p30().then(function (j) { P30 = j; desenharP30(); }).catch(function (e) { $('#p30').innerHTML = '<p class="vazio">Não carregou o plano: ' + esc(e.message) + '</p>'; });
  }

  function desenharP30() {
    var box = $('#p30'); if (!box) return;
    var a = P30.app || {};
    if (!P30.plano) {
      box.innerHTML = '<section class="cx p30-hoje"><h2>Plano de 30 dias<small>' + a.membros + ' na app · ' + a.leads + ' leads da app no CRM</small></h2>' +
        '<p style="margin:0 0 12px">Diz-me onde queres chegar daqui a 30 dias. Eu monto o mês: um conteúdo por dia pronto a abrir no Estúdio, uma acção de negócio por dia e um desafio por semana para a comunidade da app.</p>' +
        '<form id="fP30" class="form"><label>O que queres conquistar nestes 30 dias?<textarea name="objetivo" rows="2" maxlength="300" placeholder="Ex.: 300 pessoas na app, 10 conversas marcadas, a landing a converter">' + '</textarea></label>' +
        '<div style="margin:10px 0"><span style="color:var(--suave);font-size:14px">Foco</span><div class="p30-foco">' + FOCOS.map(function (f, i) { return '<label><input type="checkbox" name="foco" value="' + esc(f) + '"' + (i < 3 ? ' checked' : '') + '>' + esc(f) + '</label>'; }).join('') + '</div></div>' +
        '<div class="p30-acoes"><label style="display:flex;gap:8px;align-items:center">Começa a <input type="date" name="inicio" value="' + P30.hoje + '" style="width:auto"></label><button class="btn ouro" type="submit">Montar o meu mês</button></div></form></section>';
      $('#fP30').onsubmit = function (e) {
        e.preventDefault(); if (p30Ocupado) return; p30Ocupado = true;
        var f = e.target, foco = $$('input[name=foco]:checked', f).map(function (i) { return i.value; });
        var bt = f.querySelector('button[type=submit]'); bt.disabled = true; bt.textContent = 'A montar o teu mês… (até 1 minuto)';
        p30({ acao: 'gerar', objetivo: f.objetivo.value, foco: foco, inicio: f.inicio.value })
          .then(function () { return p30(); }).then(function (j) { P30 = j; p30Sel = null; desenharP30(); aviso('Plano pronto.'); })
          .catch(function (er) { aviso(er.message); bt.disabled = false; bt.textContent = 'Montar o meu mês'; })
          .then(function () { p30Ocupado = false; });
      };
      return;
    }
    var pl = P30.plano, n = diaAtual(), dias = pl.dias;
    var hojeD = dias.filter(function (d) { return d.d === Math.max(1, Math.min(30, n)); })[0];
    var sel = dias.filter(function (d) { return d.d === p30Sel; })[0] || hojeD;
    var criados = dias.filter(function (d) { return d.peca_id; }).length, gravados = dias.filter(function (d) { var s = estadoDia(d); return s === 'gravado' || s === 'video' || s === 'pub'; }).length;
    var publicados = dias.filter(function (d) { return d.publicado; }).length, accoes = dias.filter(function (d) { return d.accao_feita; }).length;
    var pctDias = Math.max(0, Math.min(100, Math.round(Math.min(n, 30) / 30 * 100))), R = 40, C = 2 * Math.PI * R;
    var estadoTxt = n < 1 ? 'Começa a ' + pl.inicio : n > 30 ? 'Plano terminado' : 'Dia ' + n + ' de 30';

    var html = '<div class="p30-hero">' + cartaoDia(sel, n) +
      '<section class="cx"><h2>O teu mês<small>' + esc(estadoTxt) + '</small></h2><div class="p30-anel"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="' + R + '" fill="none" stroke="#1a1f2b" stroke-width="10"/><circle cx="50" cy="50" r="' + R + '" fill="none" stroke="url(#gP30)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pctDias / 100)).toFixed(1) + '" transform="rotate(-90 50 50)"/><defs><linearGradient id="gP30"><stop offset="0" stop-color="#1EAAE6"/><stop offset="1" stop-color="#D2A63C"/></linearGradient></defs><text x="50" y="57" text-anchor="middle" fill="#fff" font-family="Anton" font-size="22">' + pctDias + '%</text></svg>' +
        '<div><p class="kalam" style="margin:0;font-size:18px">' + esc(pl.objetivo || 'Sem objetivo escrito') + '</p>' + (pl.foco && pl.foco.length ? '<p class="vazio" style="font-size:13px">' + esc(pl.foco.join(' · ')) + '</p>' : '') + '</div></div>' +
        '<div class="kpis" style="margin-top:14px"><div class="kpi ciano"><b>' + criados + '</b><span>guiões no Estúdio</span></div><div class="kpi"><b>' + gravados + '</b><span>gravados</span></div><div class="kpi ouro"><b>' + publicados + '</b><span>publicados</span></div><div class="kpi"><b>' + accoes + '/30</b><span>acções feitas</span></div></div>' +
        '<div class="kpis" style="margin-top:12px"><div class="kpi ouro"><b>' + (a.membros || 0) + '</b><span>na app</span></div><div class="kpi"><b>+' + (a.novos30 || 0) + '</b><span>novos em 30 dias</span></div><div class="kpi ciano"><b>' + (a.leads || 0) + '</b><span>leads da app no CRM</span></div><div class="kpi"><b>' + Object.keys(P30.desafios || {}).reduce(function (s, k) { return s + P30.desafios[k]; }, 0) + '</b><span>desafios cumpridos</span></div></div></section></div>';

    html += '<section class="cx" style="margin-top:16px"><h2>Os 30 dias<small>toca num dia para o abrir</small></h2><div class="p30-dias">' + dias.map(function (d) {
      var e = estadoDia(d), dt = maisDias(pl.inicio, d.d - 1);
      return '<button type="button" class="p30-dia' + (d.d === n ? ' hoje' : '') + (sel && d.d === sel.d ? ' sel' : '') + (d.d < n ? ' passado' : '') + '" data-p30d="' + d.d + '" aria-label="Dia ' + d.d + ', ' + FMT[d.formato] + ', ' + esc(d.tema) + '"><i class="' + e + '"></i><b>' + d.d + '</b><small>' + ({ reel: 'Reel', carrossel: 'Carr.', story: 'Story', post: 'Post' })[d.formato] + '<br>' + dt.slice(8) + '/' + dt.slice(5, 7) + '</small></button>';
    }).join('') + '</div><div class="p30-leg"><span style="--c:#2a3142">Por criar</span><span style="--c:var(--ciano-claro)">Guião</span><span style="--c:#a78bfa">Gravado</span><span style="--c:var(--ouro)">Vídeo pronto</span><span style="--c:var(--bom)">Publicado</span></div></section>';

    html += '<div class="p30-sem" style="margin-top:16px">' + pl.semanas.map(function (s, i) {
      var de = maisDias(pl.inicio, i * 7), ate = maisDias(pl.inicio, i === 3 ? 29 : i * 7 + 6), t = s.teste_id ? (P30.testes || {})[s.teste_id] : null;
      var feitos = s.missao_id ? (P30.desafios || {})[s.missao_id] || 0 : 0, agora = n >= i * 7 + 1 && n <= (i === 3 ? 30 : i * 7 + 7);
      return '<section class="cx"' + (agora ? ' style="border-color:rgba(210,166,60,.5)"' : '') + '><h2>Semana ' + (i + 1) + '<small>' + de.slice(8) + '/' + de.slice(5, 7) + ' a ' + ate.slice(8) + '/' + ate.slice(5, 7) + '</small></h2>' +
        '<b style="font-weight:500;font-size:17px">' + esc(s.tema) + '</b>' +
        '<div style="color:var(--suave);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-top:4px">Desafio da app · ' + esc(s.desafio.tipo) + '</div><b style="font-weight:500">' + esc(s.desafio.titulo) + '</b><ol>' + s.desafio.passos.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>' +
        (s.missao_id ? '<span class="pilula on">Na app · ' + feitos + ' cumpriram</span>' : '<button type="button" class="btn peq ouro" data-p30app="' + i + '">Publicar na app</button>') +
        (t ? '<div><span class="pilula ' + (t.estado === 'feito' ? 'on' : t.estado === 'falhou' || t.estado === 'recusado' ? 'off' : 'novo') + '">Público virtual · ' + esc(t.estado) + '</span>' + (t.resumo ? '<div class="rel" style="margin-top:6px">' + esc(t.resumo) + '</div>' : '') + '</div>'
          : '<button type="button" class="btn peq" data-p30mf="' + i + '">Testar ideias no público virtual</button>') + '</section>';
    }).join('') + '</div>';
    html += '<p style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="vazio" style="font-size:13px">Plano montado por ' + esc(pl.gerado_por || '—') + ' a ' + esc(String(pl.criado).slice(0, 10)) + '.</span><button type="button" class="btn peq fant" data-p30novo="1">Montar um plano novo</button></p>';
    box.innerHTML = html;
    box.onclick = cliqueP30;
    box.onchange = mudancaP30;
  }

  function cartaoDia(d, n) {
    if (!d) return '';
    var e = estadoDia(d), dt = maisDias(P30.plano.inicio, d.d - 1), quando = d.d === n ? 'Hoje' : (d.d < n ? 'Já passou' : 'Daqui a ' + (d.d - n) + ' dia' + (d.d - n === 1 ? '' : 's'));
    return '<section class="cx p30-hoje"><h2>Dia ' + d.d + ' · ' + dt.slice(8) + '/' + dt.slice(5, 7) + '<small>' + quando + '</small></h2>' +
      '<div class="p30-acoes"><span class="pilula novo">' + FMT[d.formato] + '</span><span class="pilula">' + OBJN[d.objectivo] + '</span>' + (e && e !== 'pub' ? '<span class="pilula on">' + EST30[e] + '</span>' : '') + (d.publicado ? '<span class="pilula on">Publicado</span>' : '') + '</div>' +
      '<p class="tema">' + esc(d.tema) + '</p><p class="gancho">«' + esc(d.gancho) + '»</p>' +
      '<div class="p30-acoes">' + (d.peca_id && e !== 'perdido'
        ? '<a class="btn ouro" href="/estudio?tab=gravar&peca=' + encodeURIComponent(d.peca_id) + '">Gravar no teleprompter</a><a class="btn" href="/estudio?tab=ativos&peca=' + encodeURIComponent(d.peca_id) + '">Abrir no Estúdio</a>'
        : '<a class="btn ouro" href="' + esc(linkEstudio(d)) + '">Criar no Estúdio</a>') +
      '<label class="check" style="border:0;padding:0 6px"><input type="checkbox" data-p30pub="' + d.d + '"' + (d.publicado ? ' checked' : '') + '><span>Publicado</span></label></div>' +
      '<label class="check ' + (d.accao_feita ? 'feito' : '') + '" style="margin-top:10px;border-top:1px solid #232a38;border-bottom:0"><input type="checkbox" data-p30ac="' + d.d + '"' + (d.accao_feita ? ' checked' : '') + '><span><small style="display:block;color:var(--ouro-claro);font-size:12px;letter-spacing:1px;text-transform:uppercase;text-decoration:none">Acção do dia</small>' + esc(d.accao) + '</span></label>' +
      '<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--suave);font-size:14px">Mudar este dia</summary><form class="form" data-p30ed="' + d.d + '" style="margin-top:8px">' +
        '<label>Tema<input name="tema" maxlength="120" value="' + esc(d.tema) + '"></label><label>Gancho<input name="gancho" maxlength="140" value="' + esc(d.gancho) + '"></label>' +
        '<div class="linha2"><label>Formato<select name="formato">' + Object.keys(FMT).map(function (k) { return '<option value="' + k + '"' + (k === d.formato ? ' selected' : '') + '>' + FMT[k] + '</option>'; }).join('') + '</select></label><label>Objectivo<select name="objectivo">' + Object.keys(OBJN).map(function (k) { return '<option value="' + k + '"' + (k === d.objectivo ? ' selected' : '') + '>' + OBJN[k] + '</option>'; }).join('') + '</select></label></div>' +
        '<label>Acção do dia<input name="accao" maxlength="140" value="' + esc(d.accao) + '"></label><button class="btn pri peq" type="submit">Guardar</button></form></details></section>';
  }

  function aplicar(pr, ok) {
    if (p30Ocupado) return; p30Ocupado = true;
    pr.then(function () { return p30(); }).then(function (j) { P30 = j; desenharP30(); if (ok) aviso(ok); })
      .catch(function (e) { aviso(e.message); }).then(function () { p30Ocupado = false; });
  }
  function cliqueP30(e) {
    var b = e.target.closest('[data-p30d],[data-p30app],[data-p30mf],[data-p30novo]'); if (!b) return;
    if (b.hasAttribute('data-p30d')) { p30Sel = +b.getAttribute('data-p30d'); desenharP30(); var h = $('.p30-hoje'); if (h && window.innerWidth < 1000) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (b.hasAttribute('data-p30app')) { b.disabled = true; aplicar(p30({ acao: 'missao_app', semana: +b.getAttribute('data-p30app') }), 'Desafio publicado na app. Aparece em cima das missões dessa semana.'); return; }
    if (b.hasAttribute('data-p30mf')) { b.disabled = true; aplicar(p30({ acao: 'mirofish', semana: +b.getAttribute('data-p30mf') }), 'Pedido enviado ao público virtual. O resultado aparece aqui quando o Mac o correr.'); return; }
    if (b.hasAttribute('data-p30novo')) { if (!confirm('Montar um plano novo? O actual sai, e o desafio publicado na app também.')) return; P30.plano = null; desenharP30(); }
  }
  function mudancaP30(e) {
    var i = e.target, d;
    if ((d = i.getAttribute('data-p30pub'))) aplicar(p30({ acao: 'marcar', dia: +d, campo: 'publicado', v: i.checked }), i.checked ? 'Marcado como publicado.' : '');
    if ((d = i.getAttribute('data-p30ac'))) aplicar(p30({ acao: 'marcar', dia: +d, campo: 'accao_feita', v: i.checked }), i.checked ? 'Feito. Mais um passo.' : '');
  }
  document.addEventListener('submit', function (e) {
    var f = e.target; if (!f.hasAttribute || !f.hasAttribute('data-p30ed')) return; e.preventDefault();
    aplicar(p30({ acao: 'editar', dia: +f.getAttribute('data-p30ed'), campos: { tema: f.tema.value, gancho: f.gancho.value, accao: f.accao.value, formato: f.formato.value, objectivo: f.objectivo.value } }), 'Dia guardado.');
  });

  // ───────────── arranque ─────────────
  function bloqueado(msg) {
    // Sem sessão MoreThanMoney: vai direto ao login (que volta aqui). Com sessão, a conta não é a do Ricardo.
    if (!/(^|;\s*)sb-[^=]+-auth-token/.test(document.cookie)) { location.replace('/login?redirect=' + encodeURIComponent('/ricardogarcia/painel' + location.hash)); return; }
    $('#raiz').innerHTML = '<div class="bloqueado"><div class="cx"><img src="/ricardogarcia/icone.png" alt="" width="56" height="56" style="border-radius:14px"><h1>Painel do Ricardo</h1><p class="vazio">' + esc(msg) + '</p><p style="margin-top:16px"><a class="btn pri" href="/login?redirect=' + encodeURIComponent('/ricardogarcia/painel') + '">Entrar</a></p></div></div>';
  }
  window.addEventListener('beforeunload', function (e) { if (sujo) { e.preventDefault(); e.returnValue = ''; } });
  pedir().then(function (j) {
    S = j; estrutura();
    var h = (location.hash || '').slice(1);
    ir(VISTAS.some(function (v) { return v[0] === h; }) ? h : 'hoje');
  }).catch(function (e) {
    bloqueado(e.status === 401 || e.status === 403 ? 'Esta área é só tua. Entra com a tua conta de administrador.' : 'Não consegui abrir o painel agora. Tenta outra vez daqui a pouco.');
  });
})();
</script>
