<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 350' width='640' height='350' font-family='Helvetica,Arial,sans-serif'><title>Dois pedidos a uma IA</title><rect width='640' height='350' rx='18' fill='#0b0e14'/><text x='24' y='38' font-size='20' font-weight='700' fill='#E9C46A'>Dois pedidos à mesma IA</text><rect x='24' y='80' width='284' height='240' rx='14' fill='#121722' stroke='#1f2532'/><text x='42' y='112' font-size='18' font-weight='700' fill='#E9C46A'>Pedido A</text><text x='42' y='146' font-size='14' fill='#E8E6E1'>«Escreve um post</text><text x='42' y='168' font-size='14' fill='#E8E6E1'> sobre poupança.»</text><rect x='332' y='80' width='284' height='240' rx='14' fill='#121722' stroke='#1f2532'/><text x='350' y='112' font-size='18' font-weight='700' fill='#E9C46A'>Pedido B</text><text x='350' y='146' font-size='14' fill='#E8E6E1'>«És um educador financeiro.</text><text x='350' y='168' font-size='14' fill='#E8E6E1'>Escreve um post de Instagram</text><text x='350' y='190' font-size='14' fill='#E8E6E1'>para jovens de 20 a 30 anos</text><text x='350' y='212' font-size='14' fill='#E8E6E1'>sobre poupar 10% do salário.</text><text x='350' y='234' font-size='14' fill='#E8E6E1'>Tom próximo, máx. 120 palavras,</text><text x='350' y='256' font-size='14' fill='#E8E6E1'>termina com uma pergunta.»</text><text x='626' y='338' text-anchor='end' font-size='11' fill='#8A8F98'>Ilustrativo · MTM Missão</text></svg>