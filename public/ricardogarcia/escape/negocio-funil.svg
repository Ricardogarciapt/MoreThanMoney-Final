<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360' width='640' height='360' font-family='Helvetica,Arial,sans-serif'><title>Funil de conversão</title><rect width='640' height='360' rx='18' fill='#0b0e14'/><text x='24' y='38' font-size='20' font-weight='700' fill='#E9C46A'>Funil de um negócio local</text><text x='24' y='60' font-size='13' fill='#8A8F98'>Um mês de exemplo</text><path d='M40.0 86 h560 l-40 70 h-480 z' fill='#1EAAE6' opacity='.9'/><text x='320' y='118' text-anchor='middle' font-size='22' font-weight='700' fill='#0b0e14'>1 000</text><text x='320' y='140' text-anchor='middle' font-size='13' fill='#0b0e14'>pessoas viram a página</text><path d='M130.0 172 h380 l-40 70 h-300 z' fill='#D2A63C' opacity='.9'/><text x='320' y='204' text-anchor='middle' font-size='22' font-weight='700' fill='#0b0e14'>100</text><text x='320' y='226' text-anchor='middle' font-size='13' fill='#0b0e14'>pediram contacto</text><path d='M220.0 258 h200 l-40 70 h-120 z' fill='#3CCF8E' opacity='.9'/><text x='320' y='290' text-anchor='middle' font-size='22' font-weight='700' fill='#0b0e14'>10</text><text x='320' y='312' text-anchor='middle' font-size='13' fill='#0b0e14'>tornaram-se clientes</text><text x='626' y='348' text-anchor='end' font-size='11' fill='#8A8F98'>Ilustrativo · MTM Missão</text></svg>