<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Email de Teste - MTM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #D2A63C;
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(210, 166, 60, 0.3);
    }
    
    h1 {
      color: #D2A63C;
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }
    
    .info-box {
      background: rgba(210, 166, 60, 0.1);
      border: 1px solid #D2A63C;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .info-box h3 {
      color: #D2A63C;
      margin-bottom: 10px;
      font-size: 16px;
    }
    
    .info-box p {
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    
    button {
      width: 100%;
      background: linear-gradient(135deg, #D2A63C 0%, #BB8525 100%);
      color: black;
      border: none;
      padding: 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 15px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(210, 166, 60, 0.4);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 2px solid #D2A63C;
    }
    
    #log {
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #0f0;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
      display: none;
    }
    
    #log.show {
      display: block;
    }
    
    .log-line {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📧 Enviar Email de Teste</h1>
    <p class="subtitle">Sistema de Email Marketing MTM</p>
    
    <div class="info-box">
      <h3>📊 Informações do Teste:</h3>
      <p><strong>Template:</strong> vision_announcement</p>
      <p><strong>Assunto:</strong> 🧪 TESTE - A Nossa Jornada Juntos</p>
      <p><strong>Para:</strong> Apenas admins</p>
      <p><strong>De:</strong> morethanmoneypt@gmail.com</p>
    </div>
    
    <button onclick="sendTestEmail()" id="sendBtn">
      🚀 Enviar Email de Teste
    </button>
    
    <button onclick="sendToAll()" id="sendAllBtn" class="secondary">
      📢 Enviar para TODOS os Membros
    </button>
    
    <div id="log"></div>
  </div>

  <script>
    const log = document.getElementById('log');
    
    function addLog(message, type = 'info') {
      log.classList.add('show');
      const color = type === 'success' ? '#0f0' : type === 'error' ? '#f00' : '#fff';
      log.innerHTML += `<div class="log-line" style="color: ${color}">${message}</div>`;
      log.scrollTop = log.scrollHeight;
    }
    
    async function sendTestEmail() {
      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Criando campanha...';
      
      log.innerHTML = '';
      addLog('🚀 Iniciando envio de email de teste...');
      
      try {
        // Criar campanha com timeout
        addLog('📝 Criando campanha...');
        addLog('🔗 POST /api/email-marketing/campaigns');
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout
        
        const res1 = await fetch('/api/email-marketing/campaigns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: 'TESTE - Visão MTM - ' + new Date().toISOString(),
            subject: '🧪 TESTE - A Nossa Jornada Juntos',
            template_name: 'vision_announcement',
            type: 'broadcast',
            segment: 'admin'
          }),
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        addLog(`📊 Response status: ${res1.status}`);
        
        if (!res1.ok) {
          const errorText = await res1.text();
          addLog(`❌ Erro HTTP ${res1.status}: ${errorText}`, 'error');
          throw new Error(`HTTP ${res1.status}: ${errorText}`);
        }
        
        const campaign = await res1.json();
        addLog(`📦 Response: ${JSON.stringify(campaign).substring(0, 200)}...`);
        
        if (!campaign.success) {
          addLog('❌ Erro: ' + campaign.error, 'error');
          alert('❌ Erro ao criar campanha:\n\n' + campaign.error + '\n\nVerifique se executou o SQL no Supabase primeiro!');
          btn.disabled = false;
          btn.textContent = '🚀 Enviar Email de Teste';
          return;
        }
        
        addLog(`✅ Campanha criada!`, 'success');
        addLog(`📊 Destinatários: ${campaign.campaign.total_recipients} admin(s)`);
        
        const confirmar = confirm(
          `📧 CONFIRMAR ENVIO DE TESTE?\n\n` +
          `Para: ${campaign.campaign.total_recipients} admin(s)\n` +
          `Assunto: "${campaign.campaign.subject}"\n` +
          `De: morethanmoneypt@gmail.com\n\n` +
          `Continuar?`
        );
        
        if (!confirmar) {
          addLog('❌ Envio cancelado pelo usuário', 'error');
          btn.disabled = false;
          btn.textContent = '🚀 Enviar Email de Teste';
          return;
        }
        
        // Enviar
        btn.textContent = '⏳ Enviando emails...';
        addLog('📤 Enviando emails...');
        addLog(`🔗 PATCH /api/email-marketing/campaigns (campaignId: ${campaign.campaign.id})`);
        
        const controller2 = new AbortController();
        const timeoutId2 = setTimeout(() => controller2.abort(), 60000); // 60s timeout
        
        const res2 = await fetch('/api/email-marketing/campaigns', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            campaignId: campaign.campaign.id,
            action: 'send'
          }),
          signal: controller2.signal
        });
        
        clearTimeout(timeoutId2);
        
        addLog(`📊 Response status: ${res2.status}`);
        
        if (!res2.ok) {
          const errorText = await res2.text();
          addLog(`❌ Erro HTTP ${res2.status}: ${errorText}`, 'error');
          throw new Error(`HTTP ${res2.status}: ${errorText}`);
        }
        
        const result = await res2.json();
        addLog(`📦 Response: ${JSON.stringify(result).substring(0, 200)}...`);
        
        if (result.success) {
          addLog(`✅ SUCESSO!`, 'success');
          addLog(`📧 Enviados: ${result.sent}`, 'success');
          addLog(`❌ Falhas: ${result.failed}`);
          addLog(`📮 Verifique: morethanmoneypt@gmail.com`, 'success');
          
          alert(
            `✅ EMAIL DE TESTE ENVIADO COM SUCESSO!\n\n` +
            `📧 ${result.sent} email(s) enviado(s)\n` +
            `❌ ${result.failed} falha(s)\n\n` +
            `Verifique sua caixa de entrada:\n` +
            `morethanmoneypt@gmail.com`
          );
        } else {
          addLog('❌ Erro ao enviar: ' + result.error, 'error');
          alert('❌ Erro ao enviar:\n\n' + result.error);
        }
        
      } catch (error) {
        if (error.name === 'AbortError') {
          addLog('❌ TIMEOUT: Requisição demorou mais de 30s', 'error');
          alert('❌ TIMEOUT!\n\nA requisição demorou muito.\n\nPossíveis causas:\n- API não está respondendo\n- Gmail não configurado\n- Erro no servidor\n\nVerifique os logs do servidor (terminal)');
        } else {
          addLog('❌ Erro: ' + error.message, 'error');
          alert('❌ Erro:\n\n' + error.message + '\n\nVerifique:\n1. SQL foi executado no Supabase?\n2. Servidor está rodando?\n3. Gmail configurado?');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Enviar Email de Teste';
      }
    }
    
    async function sendToAll() {
      const confirmar = confirm(
        `⚠️ ATENÇÃO!\n\n` +
        `Isso vai enviar o email para TODOS OS MEMBROS ATIVOS!\n\n` +
        `Tem certeza que quer continuar?\n\n` +
        `(Recomendado: Enviar teste primeiro)`
      );
      
      if (!confirmar) return;
      
      const btn = document.getElementById('sendAllBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Enviando...';
      
      log.innerHTML = '';
      addLog('🚀 Enviando email para TODOS os membros...');
      
      try {
        // Criar campanha
        addLog('📝 Criando campanha...');
        const res1 = await fetch('/api/email-marketing/campaigns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: 'Visão Conjunta MTM - Celebração',
            subject: '🚀 A Nossa Jornada Juntos - MoreThanMoney',
            template_name: 'vision_announcement',
            type: 'broadcast',
            segment: 'all'
          })
        });
        
        const campaign = await res1.json();
        
        if (!campaign.success) {
          addLog('❌ Erro: ' + campaign.error, 'error');
          alert('❌ Erro: ' + campaign.error);
          btn.disabled = false;
          btn.textContent = '📢 Enviar para TODOS os Membros';
          return;
        }
        
        addLog(`✅ Campanha criada!`, 'success');
        addLog(`👥 Total de destinatários: ${campaign.campaign.total_recipients} membros`);
        
        const segundaConfirmacao = confirm(
          `⚠️ ÚLTIMA CONFIRMAÇÃO!\n\n` +
          `Vai enviar para: ${campaign.campaign.total_recipients} membros\n\n` +
          `Isso inclui Members, VIPs e Admins.\n\n` +
          `Confirma o envio?`
        );
        
        if (!segundaConfirmacao) {
          addLog('❌ Envio cancelado', 'error');
          btn.disabled = false;
          btn.textContent = '📢 Enviar para TODOS os Membros';
          return;
        }
        
        // Enviar
        addLog('📤 Enviando para todos os membros...');
        addLog('⏰ Isso pode levar alguns minutos...');
        
        const res2 = await fetch('/api/email-marketing/campaigns', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            campaignId: campaign.campaign.id,
            action: 'send'
          })
        });
        
        const result = await res2.json();
        
        if (result.success) {
          addLog(`✅ CAMPANHA ENVIADA COM SUCESSO!`, 'success');
          addLog(`📧 Enviados: ${result.sent}`, 'success');
          addLog(`❌ Falhas: ${result.failed}`);
          addLog(`📊 Total: ${result.total}`);
          
          alert(
            `🎉 CAMPANHA ENVIADA COM SUCESSO!\n\n` +
            `📧 ${result.sent} emails enviados\n` +
            `❌ ${result.failed} falhas\n` +
            `📊 Total: ${result.total} destinatários\n\n` +
            `Ver analytics em 24h!`
          );
        } else {
          addLog('❌ Erro: ' + result.error, 'error');
          alert('❌ Erro:\n\n' + result.error);
        }
        
      } catch (error) {
        addLog('❌ Erro: ' + error.message, 'error');
        alert('❌ Erro:\n\n' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '📢 Enviar para TODOS os Membros';
      }
    }
  </script>
</body>
</html>
