const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x))
const ease = x=>{ x=clamp(x); return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2 }
const out = x=>{ x=clamp(x); return 1-Math.pow(1-x,3) }
const prog = (t,a,b)=>clamp((t-a)/(b-a))
const lerp=(a,b,k)=>a+(b-a)*k
function el(tag, cls, html, css){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; if(css) Object.assign(e.style,css); return e }
function entra(e, k, dy=40){ e.style.opacity=out(k); e.style.transform=`translateY(${(1-out(k))*dy}px)` }
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296 } }

CENAS['s01-gancho'] = {
 build(r){
  const n = el('div','abs anton',null,{left:'0',right:'0',top:'250px',textAlign:'center',fontSize:'330px',lineHeight:'1',color:'#f3ede1'}); r.append(n)
  const sub = el('div','abs',T.semana,{left:'0',right:'0',top:'600px',textAlign:'center',font:'500 44px Inter',color:'#8f887a',letterSpacing:'.2em',textTransform:'uppercase'}); r.append(sub)
  const a = el('div','abs serif',T.esforco,{left:'0',right:'0',top:'330px',textAlign:'center',fontSize:'110px',color:'#cfc6b5'}); r.append(a)
  const b = el('div','abs anton ouro',T.sistema,{left:'0',right:'0',top:'500px',textAlign:'center',fontSize:'150px'}); r.append(b)
  const linha = el('div','abs',null,{left:'50%',top:'680px',height:'6px',background:'#D2A63C',transform:'translateX(-50%)'}); r.append(linha)
  return {n,sub,a,b,linha}
 },
 update(o,k){
  const c = out(prog(k,0,.32)); o.n.textContent = Math.round(c*40)+'h'
  const sai = prog(k,.42,.5)
  o.n.style.opacity = 1-sai; o.sub.style.opacity = (1-sai)*out(prog(k,.05,.15)); o.n.style.transform=`scale(${1+sai*.15})`
  entra(o.a, prog(k,.5,.6)); o.a.style.opacity = out(prog(k,.5,.6))*(1-.6*prog(k,.68,.75))
  entra(o.b, prog(k,.66,.76))
  o.linha.style.width = (ease(prog(k,.74,.9))*900)+'px'
 }
}

CENAS['s02-problema'] = {
 build(r){
  const R = rng(7), cartoes=[]
  T.ruido.forEach((txt,i)=>{ const c=el('div','abs cartao',txt,{left:(140+R()*1400)+'px',top:(170+R()*560)+'px',padding:'20px 30px',font:'600 30px Inter',color:'#d9d2c3',transform:`rotate(${(R()-.5)*12}deg)`}); c.dataset.d=i; r.append(c); cartoes.push({c,ph:R()*6,amp:6+R()*10}) })
  const cv = el('canvas','abs',null,{left:'0',top:'0'}); cv.width=1920; cv.height=1080; r.append(cv)
  const R2=rng(3), pts=[]; let y=330; for(let i=0;i<=120;i++){ y += (R2()-.35)*14; pts.push(y) }
  const lista = el('div','abs',null,{left:'0',right:'0',top:'330px',textAlign:'center'}); r.append(lista)
  const itens = T.falta.map(t=>{ const d=el('div','anton',`<span style="color:#ff5a4f">✕</span> ${t}`,{fontSize:'120px',lineHeight:'1.2',opacity:0}); lista.append(d); return d })
  return {cartoes,cv,pts,itens}
 },
 update(o,k,s){
  const fade = 1-prog(k,.56,.64)
  o.cartoes.forEach((c,i)=>{ const a=out(prog(k,i*.04,i*.04+.08)); c.c.style.opacity=a*fade; c.c.style.marginTop=(Math.sin(s*1.3+c.ph)*c.amp)+'px' })
  const g=o.cv.getContext('2d'); g.clearRect(0,0,1920,1080); g.globalAlpha=fade
  const n=Math.floor(ease(prog(k,.1,.55))*o.pts.length)
  g.strokeStyle='#ff5a4f'; g.lineWidth=6; g.beginPath(); for(let i=0;i<n;i++){ const x=100+i*14.4, y=o.pts[i]; i?g.lineTo(x,y):g.moveTo(x,y) } g.stroke()
  o.itens.forEach((d,i)=>entra(d, prog(k,.64+i*.08,.72+i*.08)))
 }
}

CENAS['s03-quem'] = {

  const f=el('div','abs',T.quem,{left:'0',right:'0',top:'450px',textAlign:'center',font:'500 34px Inter',color:'#D2A63C',letterSpacing:'.25em',textTransform:'uppercase'}); r.append(f)
  const eco=el('div','abs',null,{left:'0',right:'0',top:'600px',display:'flex',justifyContent:'center',alignItems:'center',gap:'40px'}); r.append(eco)
  const nos=T.eco.map((t,i)=>{ const d=el('div','chip',t,{fontSize:'44px',padding:'18px 40px'}); eco.append(d); if(i<2){ const s=el('div','',null,{width:'120px',height:'3px',background:'#D2A63C',transformOrigin:'left'}); eco.append(s); d.seta=s } return d })
  const sub=el('div','abs anton',T.ecoSub,{left:'0',right:'0',top:'740px',textAlign:'center',fontSize:'70px'}); r.append(sub)
  return {nome,f,nos,sub}
 },
 update(o,k){
  const sobe = ease(prog(k,.42,.55))
  entra(o.nome,prog(k,0,.12)); o.nome.style.transform=`translateY(${-sobe*120}px)`
  entra(o.f,prog(k,.08,.2)); o.f.style.transform=`translateY(${-sobe*120}px)`
  o.nos.forEach((d,i)=>{ entra(d,prog(k,.5+i*.1,.58+i*.1),20); if(d.seta) d.seta.style.transform=`scaleX(${ease(prog(k,.55+i*.1,.63+i*.1))})` })
  entra(o.sub,prog(k,.8,.9))
 }
}

CENAS['s05-scanners'] = {
 build(r){
  const tit=el('div','abs anton ouro',T.aplicas,{left:'120px',top:'150px',fontSize:'120px'}); r.append(tit)
  const box=el('div','abs cartao',null,{left:'120px',top:'320px',width:'1100px',height:'600px',overflow:'hidden'}); r.append(box)
  const cv=el('canvas','abs',null,{left:'0',top:'0'}); cv.width=1100; cv.height=600; box.append(cv)
  const lab=el('div','abs',`XAU/USD · 15m`,{left:'30px',top:'22px',font:'600 24px JetBrains Mono',color:'#8f887a'}); box.append(lab)
  const R=rng(11), velas=[]; let p=100
  for(let i=0;i<60;i++){ const tend = i<24? -1.1 : (i<34? (R()-.5)*.6 : 1.5); const o=p, c=p + tend + (R()-.5)*3.4; const h=Math.max(o,c)+R()*1.2, l=Math.min(o,c)-R()*1.2; velas.push({o,c,h,l}); p=c }
  const mn=Math.min(...velas.map(v=>v.l)), mx=Math.max(...velas.map(v=>v.h))
  const Y=v=>70+(mx+4-v)/(mx+4-(mn-3))*490
  const base=velas.slice(24,34), zt=Math.max(...base.map(v=>Math.max(v.o,v.c))), zb=Math.min(...base.map(v=>v.l))
  const lista=el('div','abs',null,{left:'1290px',top:'340px',width:'520px'}); r.append(lista)
  const its=T.check.map(t=>{ const d=el('div','',`<span class="v" style="display:inline-block;width:54px;color:#3ddc84">✓</span>${t}`,{font:'600 46px Inter',padding:'22px 0',borderBottom:'1px solid rgba(210,166,60,.18)'}); lista.append(d); return d })
  const est=el('div','abs',T.estudos,{left:'1290px',top:'820px',width:'520px',font:'500 26px Inter',color:'#8f887a'}); r.append(est)
  return {tit,box,cv,velas,its,est,Y,zt,zb,mn,mx}
 },
 update(o,k){
  entra(o.tit,prog(k,0,.08)); entra(o.box,prog(k,.03,.12))
  const g=o.cv.getContext('2d'); g.clearRect(0,0,1100,600)
  const n=Math.floor(ease(prog(k,.08,.6))*o.velas.length), Y=o.Y, w=12, x0=40, dx=16.5
  const zk=prog(k,.35,.45); if(zk>0){ g.fillStyle=`rgba(210,166,60,${.16*zk})`; g.fillRect(x0+24*dx,Y(o.zt),1100,Y(o.zb)-Y(o.zt)); g.fillStyle='#D2A63C'; g.font='600 20px JetBrains Mono'; g.globalAlpha=zk; g.fillText('ZONA MTM',x0+24*dx+8,Y(o.zb)+26); g.globalAlpha=1 }

 }

// ---------------------------------------------------------------- linha do tempo
// window.TL = [{id, ini, dur, frases:[{t, ini, fim}]}]  (segundos absolutos)
const palco=document.getElementById('palco'), montadas={}
function montar(){ for(const c of window.TL){ const r=el('div','cena'); palco.append(r); montadas[c.id]={r,o:CENAS[c.id].build(r),c} } }
const grao=document.getElementById('grao'), gg=grao.getContext('2d'), img=gg.createImageData(960,540)
function ruido(seed){ const R=rng(seed); for(let i=0;i<img.data.length;i+=4){ const v=R()*255; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255 } gg.putImageData(img,0,0) }
let ultimoGrao=-1
window.renderAt = function(t){
 const total=window.TL[window.TL.length-1].ini+window.TL[window.TL.length-1].dur
 let atual=null
 window.TL.forEach((c,i)=>{ const m=montadas[c.id], s=t-c.ini, X=.45
  const vis = s>-X && s<c.dur+X
  m.r.style.display=vis?'block':'none'
  if(!vis) return
  const fin = (i<window.TL.length-1)? 1-prog(s,c.dur-.05,c.dur+X) : 1
  m.r.style.opacity = Math.min(prog(s,-X,.05), fin)
  m.r.style.transform = `scale(${1+.03*prog(s,0,c.dur)})`
  CENAS[c.id].update(m.o, clamp(s/c.dur), s)
  if(s>=0 && s<c.dur) atual={c,s,i}
 })
 const cap=document.getElementById('capitulo'), leg=document.getElementById('legenda')
 if(atual){ cap.textContent=String(atual.i+1).padStart(2,'0')+' · '+T.cap[atual.i]
  const f=atual.c.frases.find(f=>t>=f.ini && t<f.fim); if(f && window.LEGENDAS){ leg.style.display='block'; leg.textContent=f.t } else leg.style.display='none' }
 document.getElementById('barra').style.width=(t/total*100)+'%'
 const fr=Math.floor(t*12); if(fr!==ultimoGrao){ ruido(fr+1); ultimoGrao=fr }
}
window.iniciar = function(tl, legendas){ window.TL=tl; window.LEGENDAS=legendas; montar(); window.renderAt(0) }
</script>
