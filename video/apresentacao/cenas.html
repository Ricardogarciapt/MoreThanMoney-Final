let ultimoGrao=-1
window.renderAt = function(t){
 const total=window.TL[window.TL.length-1].ini+window.TL[window.TL.length-1].dur
 let atual=null
 window.TL.forEach((c,i)=>{ const m=montadas[c.id], s=t-c.ini, X=.45
  const vis = s>-X && s<c.dur+X
  m.r.style.display=vis?'block':'none'
  if(!vis) return
  const fin = (i<window.TL.length-1)? 1-prog(s,c.dur-.05,c.dur+X) : 1
  m.r.style.opacity = Math.min(prog(s,-X,.05), fin)
  m.r.style.transform = `scale(${1+.03*prog(s,0,c.dur)})`
  CENAS[c.id].update(m.o, clamp(s/c.dur), s)
  if(s>=0 && s<c.dur) atual={c,s,i}
 })
 const cap=document.getElementById('capitulo'), leg=document.getElementById('legenda')
 if(atual){ cap.textContent=String(atual.i+1).padStart(2,'0')+' · '+(T.cap[atual.c.id]||'')
  const f=atual.c.frases.find(f=>t>=f.ini && t<f.fim); if(f && window.LEGENDAS){ leg.style.display='block'; leg.textContent=f.t } else leg.style.display='none' }
 document.getElementById('barra').style.width=(t/total*100)+'%'
 const fr=Math.floor(t*12); if(fr!==ultimoGrao){ ruido(fr+1); ultimoGrao=fr }
}
window.iniciar = function(tl, legendas){ window.TL=tl; window.LEGENDAS=legendas; montar(); window.renderAt(0) }
</script>
</body>
</html>
